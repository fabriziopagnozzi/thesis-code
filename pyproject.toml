[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"numpy",
	"polars",
	"jupyter",
	"tqdm",
	"huggingface-hub>=1.7.1",
	"sentence-transformers>=4.1",
	"torch",
	"ijson>=3.5.0",
	"duckdb>=1.5.1",
	"lancedb>=0.30.2",
	"ollama>=0.5",
	"pyyaml>=6.0",
	"pydantic>=2.0",
	"pylance>=4.0.0",
	"fastapi>=0.136.1",
	"uvicorn>=0.46.0",
	"python-multipart>=0.0.26",
	"scikit-learn>=1.5",
	"umap-learn>=0.5",
	"hdbscan>=0.8",
	"matplotlib>=3.9",
	"plotly>=6.7.0",
	"mteb>=2.12.30",
]
[dependency-groups]
dev = [
	"ruff",
	"pytest",
	"ipykernel",
	"matplotlib-stubs",
	"pandas-stubs",
	"pyarrow-stubs",
	"taskipy",
]


[tool.taskipy.tasks]
# Chunking
chunking_full = "uv run -m experiments.mimic.chunking.run_chunking_steps"
conditions_stats = "uv run -m experiments.mimic.chunking.a_conditions_stats"
note_chunking = "uv run -m experiments.mimic.chunking.b_note_chunking"
dedup_chunks = "uv run -m experiments.mimic.chunking.c_dedup"

# Embeddings
embed_whole = "uv run -m experiments.mimic.embeddings.run_embed_whole_corpus"
embed_selective = "uv run -m experiments.mimic.embeddings.run_embed_selective"

# Evaluation
gold_annotation = "uv run -m experiments.mimic.evaluation.run_gold_annotation"
regenerate_gold_ans = "uv run -m experiments.mimic.evaluation.run_regenerate_gold_ans"
evaluation = "uv run -m experiments.mimic.evaluation.run_evaluate"
evaluation_plots = "uv run -m experiments.mimic.evaluation.plots"

# Pool Analysis
pool_analysis = "uv run -m experiments.mimic.pool_analysis.run_pool_analysis"
pool_analysis_plots = "uv run -m experiments.mimic.pool_analysis.plots"

# Queries
queries_full = "uv run -m experiments.mimic.queries.run_queries_steps"
build_prompts = "uv run -m experiments.mimic.queries.a_build_prompts"
gen_queries_llm = "uv run -m experiments.mimic.queries.b_gen_queries_llm"
filter_queries = "uv run -m experiments.mimic.queries.c_filter_queries"

# Miscellaneous
lance_viewer = "cd ~/thesis/src/thirdparty/lance_data_viewer/backend && DATA_PATH=\"/home/pagnozzi/thesis/src/experiments/mimic/_results/_vector_db\" python -m uvicorn app:app --host 127.0.0.1 --port 8080"


[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "basic"
reportOptionalIterable = false
reportOptionalMemberAccess = false
reportGeneralTypeIssues = true
exclude = [
	"**/datasets/**",
	"**/.venv/**",
	"**/build/**",
	"**/__pycache__",
	"**/node_modules",
	"**/.*",
]
executionEnvironments = [{ root = ".", extraPaths = ["./"] }]
