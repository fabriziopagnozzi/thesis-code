[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "polars",
    "tqdm",
    "sentence-transformers>=4.1",
    "torch",
    "duckdb>=1.5.1",
    "lancedb>=0.30.2",
    "ollama>=0.5",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pyarrow>=24.0.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.26",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "matplotlib>=3.9",
    "plotly>=6.7.0",
    "rouge-score>=0.1.2",
    "tabulate>=0.10.0",
    "ruamel-yaml>=0.19.1",
]
[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ipykernel",
    "jupyter",
    "matplotlib-stubs",
    "pandas-stubs",
    "pyarrow-stubs",
    "taskipy",
    "pyright>=1.1.411",
]


[tool.taskipy.tasks]
# -- Synthetic Medical Dataset ---
pipeline = "./setup.sh python -m src.experiments.medical_dataset_gen.pipeline"
report = "./setup.sh python -m src.experiments.medical_dataset_gen.reports"
query_diagnose = "./setup.sh python -m src.experiments.medical_dataset_gen.scripts.query_diagnostics_txt"
suite_validate = './setup.sh python -m src.experiments.medical_dataset_gen.suites validate'
suite_materialize = './setup.sh python -m src.experiments.medical_dataset_gen.suites materialize'
suite_freeze_geometry = './setup.sh python -m src.experiments.medical_dataset_gen.suites freeze-geometry'
migrate_v4 = './setup.sh python -m src.experiments.medical_dataset_gen.scripts.migrate_v4_to_v5'

# -- MIMIC Experiments ---
# Chunking
mimic_chunking_full = "./setup.sh python -m experiments.mimic.chunking.run_chunking_steps"
mimic_conditions_stats = "./setup.sh python -m experiments.mimic.chunking.a_conditions_stats"
mimic_note_chunking = "./setup.sh python -m experiments.mimic.chunking.b_note_chunking"
mimic_dedup_chunks = "./setup.sh python -m experiments.mimic.chunking.c_dedup"

# Embeddings
mimic_embed_whole = "./setup.sh python -m experiments.mimic.embeddings.run_embed_whole_corpus"
mimic_embed_selective = "./setup.sh python -m experiments.mimic.embeddings.run_embed_selective"

# Evaluation
mimic_gold_annotation = "./setup.sh python -m experiments.mimic.evaluation.run_gold_annotation"
mimic_regenerate_gold_ans = "./setup.sh python -m experiments.mimic.evaluation.run_regenerate_gold_ans"
mimic_evaluation = "./setup.sh python -m experiments.mimic.evaluation.run_evaluate"
mimic_evaluation_plots = "./setup.sh python -m experiments.mimic.evaluation.plots"

# Pool Analysis
mimic_pool_analysis = "./setup.sh python -m experiments.mimic.pool_analysis.run_pool_analysis"
mimic_pool_analysis_plots = "./setup.sh python -m experiments.mimic.pool_analysis.plots"

# Queries
mimic_queries_full = "./setup.sh python -m experiments.mimic.queries.run_queries_steps"
mimic_build_prompts = "./setup.sh python -m experiments.mimic.queries.a_build_prompts"
mimic_gen_queries_llm = "./setup.sh python -m experiments.mimic.queries.b_gen_queries_llm"
mimic_filter_queries = "./setup.sh python -m experiments.mimic.queries.c_filter_queries"

# Utils
mimic_lance_viewer = "cd ~/thesis/src/thirdparty/lance_data_viewer/backend && DATA_PATH=\"~/thesis/src/experiments/mimic/_results/_vector_db\" python -m uvicorn app:app --host 127.0.0.1 --port 8080"
# ---

[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
reportUnnecessaryComparison = "error"
reportGeneralTypeIssues = true
reportOptionalIterable = false
reportOptionalMemberAccess = false
# reportUnknownVariableType = false
# reportUnknownMemberType = false
# reportMissingTypeStubs = false
exclude = [
    "**/datasets/**",
    "**/.venv/**",
    "**/build/**",
    "**/__pycache__",
    "**/node_modules",
    "**/.*",
]
executionEnvironments = [{ root = ".", extraPaths = ["./"] }]
