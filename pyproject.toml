[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"numpy",
	"polars",
	"jupyter",
	"tqdm",
	"huggingface-hub>=1.7.1",
	"sentence-transformers>=4.1",
	"torch",
	"ijson>=3.5.0",
	"duckdb>=1.5.1",
	"lancedb>=0.30.2",
	"ollama>=0.5",
	"pyyaml>=6.0",
	"pydantic>=2.0",
	"pylance>=4.0.0",
	"fastapi>=0.136.1",
	"uvicorn>=0.46.0",
	"python-multipart>=0.0.26",
	"scikit-learn>=1.5",
	"umap-learn>=0.5",
	"hdbscan>=0.8",
	"matplotlib>=3.9",
	"plotly>=6.7.0",
	"mteb>=2.12.30",
	"rouge-score>=0.1.2",
	"apricot-select>=0.6.1",
	"pypdf>=6.12.2",
]
[dependency-groups]
dev = [
	"ruff",
	"pytest",
	"ipykernel",
	"matplotlib-stubs",
	"pandas-stubs",
	"pyarrow-stubs",
	"taskipy",
]


[tool.taskipy.tasks]
# Medical Dataset Generation
med_pipeline = "python -m src.experiments.medical_dataset_gen.run_pipeline"

# -----------------------------------------------------------------------------------------------
# MIMIC Experiments
# Chunking
mimic_chunking_full = "python -m src.experiments.mimic.chunking.run_chunking_steps"
mimic_conditions_stats = "python -m src.experiments.mimic.chunking.a_conditions_stats"
mimic_note_chunking = "python -m src.experiments.mimic.chunking.b_note_chunking"
mimic_dedup_chunks = "python -m src.experiments.mimic.chunking.c_dedup"

# Embeddings
mimic_embed_whole = "python -m src.experiments.mimic.embeddings.run_embed_whole_corpus"
mimic_embed_selective = "python -m src.experiments.mimic.embeddings.run_embed_selective"

# Evaluation
mimic_gold_annotation = "python -m src.experiments.mimic.evaluation.run_gold_annotation"
mimic_regenerate_gold_ans = "python -m src.experiments.mimic.evaluation.run_regenerate_gold_ans"
mimic_evaluation = "python -m src.experiments.mimic.evaluation.run_evaluate"
mimic_evaluation_plots = "python -m src.experiments.mimic.evaluation.plots"

# Pool Analysis
mimic_pool_analysis = "python -m src.experiments.mimic.pool_analysis.run_pool_analysis"
mimic_pool_analysis_plots = "python -m src.experiments.mimic.pool_analysis.plots"

# Queries
mimic_queries_full = "python -m src.experiments.mimic.queries.run_queries_steps"
mimic_build_prompts = "python -m src.experiments.mimic.queries.a_build_prompts"
mimic_gen_queries_llm = "python -m src.experiments.mimic.queries.b_gen_queries_llm"
mimic_filter_queries = "python -m src.experiments.mimic.queries.c_filter_queries"

# Utils
mimic_lance_viewer = "cd ~/thesis/src/thirdparty/lance_data_viewer/backend && DATA_PATH=\"/home/pagnozzi/thesis/src/experiments/mimic/_results/_vector_db\" python -m uvicorn app:app --host 127.0.0.1 --port 8080"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "basic"
reportOptionalIterable = false
reportOptionalMemberAccess = false
reportGeneralTypeIssues = true
exclude = [
	"**/datasets/**",
	"**/.venv/**",
	"**/build/**",
	"**/__pycache__",
	"**/node_modules",
	"**/.*",
]
executionEnvironments = [{ root = ".", extraPaths = ["./"] }]
