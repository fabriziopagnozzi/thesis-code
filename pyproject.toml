[project]
name = "thesis"
version = "0.1.0"
description = "MSc thesis project: Coverage vs Dispersion Diversity in RAG Retrieval"
requires-python = ">=3.14"
dependencies = [
	"numpy",
	"polars",
	"jupyter",
	"tqdm",
	"huggingface-hub>=1.7.1",
	"sentence-transformers>=4.1",
	"torch",
	"ijson>=3.5.0",
	"duckdb>=1.5.1",
	"lancedb>=0.30.2",
	"ollama>=0.5",
	"pyyaml>=6.0",
	"pydantic>=2.0",
	"pylance>=4.0.0",
]
[dependency-groups]
dev = ["ruff", "pytest", "ipykernel", "matplotlib-stubs", "taskipy"]

[tool.taskipy.tasks]
mimic = "uv run -m experiments.mimic.main"
add_new_embeddings = "uv run -m experiments.mimic.phase_2_embedding.add_new_vector_col"
build_vector_indexes = "uv run -m experiments.mimic.phase_2_embedding.build_vector_indexes"
phase1 = "uv run -m experiments.mimic.phase_1_chunking.orchestrator_1"
phase2 = "uv run -m experiments.mimic.phase_2_embedding.a_embed"
phase3 = "uv run -m experiments.mimic.phase_3_queries.orchestrator_3"
phase4 = "uv run -m experiments.mimic.phase_4_evaluation.a_evaluate"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
