[project]
name = "thesis"
version = "0.1.0"
description = "MSc thesis project: Coverage vs Dispersion Diversity in RAG Retrieval"
requires-python = ">=3.14"
dependencies = [
	"numpy",
	"polars",
	"scipy",
	"scikit-learn",
	"matplotlib",
	"seaborn",
	"jupyter",
	"tqdm",
	"huggingface-hub>=1.7.1",
	"sentence-transformers>=4.1",
	"torch",
	"ir-datasets>=0.5.11",
	"langchain>=1.2.13",
	"langchain-text-splitters>=1.1.1",
	"ijson>=3.5.0",
	"duckdb>=1.5.1",
	"lancedb>=0.30.2",
	"ollama>=0.5",
]
[dependency-groups]
dev = ["ruff", "pytest", "ipykernel", "matplotlib-stubs", "taskipy"]

# Like NPM scripts
[tool.taskipy.tasks]
stats = "python -m experiments.mimic.stats"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
