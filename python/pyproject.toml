[project]
name = "thesis"
version = "0.1.0"
description = "MSc thesis project — Coverage vs Dispersion Diversity in RAG Retrieval"
requires-python = ">=3.14"
dependencies = [
	"numpy",
	"polars",
	"scipy",
	"scikit-learn",
	"matplotlib",
	"seaborn",
	"jupyter",
	"tqdm",
	"huggingface-hub>=1.7.1",
	"sentence-transformers>=4.1",
	"torch>=2.0",
	"ir-datasets>=0.5.11",
	"langchain>=1.2.13",
	"langchain-text-splitters>=1.1.1",
	"ijson>=3.5.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = ["ruff", "pytest", "ipykernel", "matplotlib-stubs"]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
