# Matched native-v5 thesis suite.  Dataset distributions are defined once and
# crossed with run profiles below; no directory name encodes a scientific
# factor.  The migrated v4 suite remains an immutable archival record.
layout_version: 5
suite_id: thesis_v5
origin: native
dataset_schema_version: 5
description: >-
    Controlled factorial thesis study of candidate-pool mass, topology, scale,
    and wording effects on top-k, MMR, and facility location.

distributions:
    balanced_reference:
        family_id: balanced_clean
        family_label: Balanced clean distributions
        tags: [core, reference, scale, smoke]
        analysis_blocks: [reference, scale]
        analysis_tier: core
        nested_from: scale_balanced_small
        factors: &balanced_factors
            scale: medium
            gold_mass_vector: [24, 24, 24, 24]
            niche_count: 0
            near_miss_mass: 16
            background_mass: 16
            scale_anchor: balanced
        config: &reference_config
            global: { seed: 42, conditions: 22, use_shared: true }
            generation:
                chunk_pools:
                    dominant_primary:
                        {
                            num_clusters: 1,
                            chunks_per_cluster: 24,
                            distractors: [],
                        }
                    other_primary:
                        {
                            num_clusters: 1,
                            chunks_per_cluster: 24,
                            distractors: [],
                        }
                    secondary:
                        {
                            num_clusters: 1,
                            chunks_per_cluster: 24,
                            distractors: [],
                        }
                    niche:
                        {
                            num_clusters: 1,
                            chunks_per_cluster: 1,
                            num_clusters_per_query: 0,
                            distractors: [],
                        }
                    background_outliers:
                        - {
                              num_clusters: 4,
                              chunks_per_cluster: 4,
                              changes: [condition, subgroup, axis],
                          }
                near_miss_specs:
                    - {
                          changes: [condition],
                          num_clusters: 1,
                          chunks_per_cluster: 4,
                      }
                    - {
                          changes: [subgroup],
                          num_clusters: 1,
                          chunks_per_cluster: 4,
                      }
                    - {
                          changes: [condition, axis_value_bin],
                          num_clusters: 1,
                          chunks_per_cluster: 4,
                      }
                    - {
                          changes: [subgroup, axis_value_bin],
                          num_clusters: 1,
                          chunks_per_cluster: 4,
                      }
            retrieval:
                pool_scope: query_local
                candidate_pool_n: 999999
                k_values: [4, 6, 10, 14]
                strategies: [top_k, mmr, fac_loc]
            evaluation: { mode: testing }

