      distribution_ids: &all_distributions
          - balanced_reference
          - dominance_mild
          - dominance_high
          - dominance_extreme
          - sparse_one_moderate
          - sparse_one_severe
          - sparse_one_extreme
          - sparse_two_moderate
          - sparse_two_severe
          - sparse_two_extreme
          - near_miss_h0
          - near_miss_h24
          - near_miss_h48
          - near_miss_h96
          - dilution_far_b40
          - dilution_far_b64
          - dilution_far_b112
          - near_miss_h48_two_change
          - near_miss_h48_one_change
          - near_miss_h48_singleton
          - near_miss_h48_compact
          - background_far_32x1
          - background_far_16x2
          - background_far_8x4
          - background_far_4x8
          - scale_balanced_small
          - scale_balanced_large
          - scale_dominance_small
          - scale_dominance_large
          - scale_sparse_one_small
          - scale_sparse_one_large
          - scale_near_miss_small
          - scale_near_miss_medium
          - scale_near_miss_large
          - scale_compact_background_small
          - scale_compact_background_medium
          - scale_compact_background_large
          - interaction_dom_high_far_32x1
          - interaction_dom_high_far_4x8
          - interaction_sparse_severe_h24
          - interaction_sparse_severe_h96
      run_profile_ids:
          [
              qwen_biased_simple,
              qwen_biased_hardened,
              qwen_unbiased_simple,
              qwen_unbiased_hardened,
          ]
comparison_groups:
    - comparison_id: dominance_ladder
      distribution_ids:
          [
              balanced_reference,
              dominance_mild,
              dominance_high,
              dominance_extreme,
          ]
      varying_factors: [dominance_level]
      factor_levels: { dominance_level: [control, mild, high, extreme] }
      reference_levels: { dominance_level: control }
      owned_paths:
          {
              dominance_level:
                  [
                      generation.chunk_pools.dominant_primary,
                      generation.chunk_pools.other_primary,
                      generation.chunk_pools.secondary,
                      generation.chunk_pools.niche,
                  ],
          }
      analysis_block: dominance
    - comparison_id: sparse_one_ladder
      distribution_ids:
          [
              balanced_reference,
              sparse_one_moderate,
              sparse_one_severe,
              sparse_one_extreme,
          ]
      varying_factors: [sparse_level]
      factor_levels: { sparse_level: [control, moderate, severe, extreme] }
      reference_levels: { sparse_level: control }
      owned_paths:
          {
              sparse_level:
                  [
                      generation.chunk_pools.dominant_primary,
                      generation.chunk_pools.other_primary,
                      generation.chunk_pools.secondary,
                      generation.chunk_pools.niche,
                  ],
          }
      analysis_block: sparse_one
    - comparison_id: sparse_two_ladder
      distribution_ids:
          [
              balanced_reference,
              sparse_two_moderate,
              sparse_two_severe,
              sparse_two_extreme,
          ]
      varying_factors: [sparse_level]
      factor_levels: { sparse_level: [control, moderate, severe, extreme] }
      reference_levels: { sparse_level: control }
      owned_paths:
          {
              sparse_level:
                  [
                      generation.chunk_pools.dominant_primary,
                      generation.chunk_pools.other_primary,
                      generation.chunk_pools.secondary,
                      generation.chunk_pools.niche,
                  ],
          }
      analysis_block: sparse_two
    - comparison_id: near_miss_load
      distribution_ids:
          [near_miss_h0, near_miss_h24, near_miss_h48, near_miss_h96]
      varying_factors: [near_miss_mass]
      factor_levels: { near_miss_mass: [0, 24, 48, 96] }
      reference_levels: { near_miss_mass: 0 }
      owned_paths: { near_miss_mass: [generation.near_miss_specs] }
      analysis_block: near_miss_load
    - comparison_id: near_miss_vs_matched_dilution
      distribution_ids:
          [
              near_miss_h24,
              near_miss_h48,
              near_miss_h96,
              dilution_far_b40,
              dilution_far_b64,
              dilution_far_b112,
          ]
      varying_factors: [added_component, added_mass]
      matching_factors: [gold_mass_vector, niche_count]
      factor_levels:
          {
              added_component: [near_miss, far_background],
              added_mass: [24, 48, 96],
          }
      reference_levels: { added_component: near_miss, added_mass: 24 }
      owned_paths:
          {
              added_component:
                  [
                      generation.near_miss_specs,
                      generation.chunk_pools.background_outliers,
                  ],
              added_mass:
                  [
                      generation.near_miss_specs,
                      generation.chunk_pools.background_outliers,
                  ],
          }
      analysis_block: matched_dilution
    - comparison_id: near_miss_structure
      distribution_ids:
          [near_miss_h48_two_change, near_miss_h48, near_miss_h48_one_change]
      varying_factors: [one_change_fraction]
      matching_factors: [near_miss_mass, background_mass]
      factor_levels: { one_change_fraction: [0.0, 0.5, 1.0] }
      reference_levels: { one_change_fraction: 0.5 }
      owned_paths: { one_change_fraction: [generation.near_miss_specs] }
      analysis_block: near_miss_structure
    - comparison_id: near_miss_topology
      distribution_ids:
          [near_miss_h48_singleton, near_miss_h48_compact, near_miss_h48]
      varying_factors: [near_miss_topology]
      matching_factors: [near_miss_mass, one_change_fraction, background_mass]
      factor_levels: { near_miss_topology: [48x1, 12x4, 4x12] }
      reference_levels: { near_miss_topology: 4x12 }
      owned_paths: { near_miss_topology: [generation.near_miss_specs] }
      analysis_block: near_miss_topology
    - comparison_id: background_topology
      distribution_ids:
          [
              background_far_32x1,
              background_far_16x2,
              background_far_8x4,
              background_far_4x8,
          ]
      varying_factors: [background_topology]
      matching_factors: [background_mass, near_miss_mass]
      factor_levels: { background_topology: [32x1, 16x2, 8x4, 4x8] }
      reference_levels: { background_topology: 32x1 }
      owned_paths:
          { background_topology: [generation.chunk_pools.background_outliers] }
      analysis_block: background_topology
    - comparison_id: scale_balanced
      distribution_ids:
          [scale_balanced_small, balanced_reference, scale_balanced_large]
      varying_factors: [scale]
      factor_levels: { scale: [small, medium, large] }
      reference_levels: { scale: medium }
      owned_paths:
          { scale: [generation.chunk_pools, generation.near_miss_specs] }
      analysis_block: scale
    - comparison_id: scale_dominance
      distribution_ids:
          [scale_dominance_small, dominance_high, scale_dominance_large]
      varying_factors: [scale]
      factor_levels: { scale: [small, medium, large] }
      reference_levels: { scale: medium }
      owned_paths:
          { scale: [generation.chunk_pools, generation.near_miss_specs] }
      analysis_block: scale
    - comparison_id: scale_sparse_one
      distribution_ids:
          [scale_sparse_one_small, sparse_one_moderate, scale_sparse_one_large]
      varying_factors: [scale]
      factor_levels: { scale: [small, medium, large] }
      reference_levels: { scale: medium }
      owned_paths:
          { scale: [generation.chunk_pools, generation.near_miss_specs] }
      analysis_block: scale
    - comparison_id: scale_near_miss
      distribution_ids:
          [scale_near_miss_small, scale_near_miss_medium, scale_near_miss_large]
      varying_factors: [scale]
      factor_levels: { scale: [small, medium, large] }
      reference_levels: { scale: medium }
      owned_paths:
          { scale: [generation.chunk_pools, generation.near_miss_specs] }
      analysis_block: scale
    - comparison_id: scale_compact_background
      distribution_ids:
          [
              scale_compact_background_small,
              scale_compact_background_medium,
              scale_compact_background_large,
          ]
      varying_factors: [scale]
