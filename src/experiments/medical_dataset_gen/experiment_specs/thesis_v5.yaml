      analysis_block: scale
    - comparison_id: interaction_dominance_background
      distribution_ids:
          [
              background_far_32x1,
              background_far_4x8,
              interaction_dom_high_far_32x1,
              interaction_dom_high_far_4x8,
          ]
      varying_factors: [dominance_level, background_topology]
      matching_factors: [background_mass, near_miss_mass]
      factor_levels:
          { dominance_level: [control, high], background_topology: [32x1, 4x8] }
      reference_levels: { dominance_level: control, background_topology: 32x1 }
      owned_paths:
          {
              dominance_level:
                  [
                      generation.chunk_pools.dominant_primary,
                      generation.chunk_pools.other_primary,
                      generation.chunk_pools.secondary,
                      generation.chunk_pools.niche,
                  ],
              background_topology: [generation.chunk_pools.background_outliers],
          }
      analysis_block: dominance_background_interaction
    - comparison_id: interaction_sparse_near_miss
      distribution_ids:
          [
              near_miss_h24,
              near_miss_h96,
              interaction_sparse_severe_h24,
              interaction_sparse_severe_h96,
          ]
      varying_factors: [sparse_level, near_miss_mass]
      matching_factors: [background_mass, one_change_fraction]
      factor_levels:
          { sparse_level: [control, severe], near_miss_mass: [24, 96] }
      reference_levels: { sparse_level: control, near_miss_mass: 24 }
      owned_paths:
          {
              sparse_level:
                  [
                      generation.chunk_pools.dominant_primary,
                      generation.chunk_pools.other_primary,
                      generation.chunk_pools.secondary,
                      generation.chunk_pools.niche,
                  ],
              near_miss_mass: [generation.near_miss_specs],
          }
      analysis_block: sparse_near_miss_interaction
