dataset_schema_version: 2

global:
  seed: 42 # Random seed used by deterministic query/fact/chunk generation.
  conditions: 22 # Full bundled ontology coverage; pair-policy gating can still suppress clinically entangled orientations.

generation:
  query_limit: null # Optional deterministic prefix for smoke runs; null emits the full ontology-policy-compliant query set (currently 10,880 queries with the bundled ontology).
  ontology_path: null # Optional path to a custom ontology YAML.
  axis_pair_policy_overrides: [] # Optional config-layer pair gating applied after ontology policies, keyed by unordered axis pair.

  calibration_mode: embedding_calibrated # Use "rotating" for deterministic smoke runs without embeddings.
  calibration_probe_chunks_per_facet: 8 # Per-facet probes used to select query emphasis, audit semantic separability, and choose the 24-chunk primary cohort.

  chunk_pools:
    primary_calibrated:
      size: 24
      distractors:
        - size: 3
          changes: [subgroup]
        - size: 2
          changes: [condition]
        - size: 2
          changes: [condition, subgroup]
        - size: 1
          changes: [subgroup, axis_value_bin]

    other_primary:
      size: 20
      distractors:
        - size: 2
          changes: [subgroup]
        - size: 2
          changes: [condition]
        - size: 2
          changes: [condition, subgroup]

    secondary:
      size: 14
      distractors:
        - size: 2
          changes: [subgroup]
        - size: 2
          changes: [condition]
        - size: 2
          changes: [condition, subgroup]

    niche:
      size: 4 # Gold documents in each niche facet; must stay below secondary.size.
      num_clusters_per_query: 1 # Number (0-2) of complementary facets made deliberately sparse.
      distractors:
        - size: 2
          changes: [subgroup]
        - size: 2
          changes: [condition]
        - size: 2
          changes: [condition, subgroup]

    background_outliers:
      - size: 8 # Chunks in each coherent non-gold clinical island.
        num_clusters: 1

    chunk_min_words: 25
    chunk_max_words: 200
    chunk_word_tolerance: 5 # Soft tolerance around the target range for concise deterministic prose.

  llm_config:
    use_llm_chunk_generation: false
    use_llm_chunk_rewriting: false # If true and chunk generation is deterministic, rewrite fallback chunks with the LLM via the isolated global rewrite cache.
    use_llm_query_paraphrase: false # If true, generated query strings are paraphrased by LLM.
    model_name: gemma4:12b # Ollama generation model. This pipeline passes it explicitly; no OLLAMA_MODEL env var is needed.
    num_workers: 2 # Parallel chunk-generation workers. Match this with Ollama server OLLAMA_NUM_PARALLEL.
    max_attempts: 3 # Maximum LLM retries per chunk before that query is dropped from the benchmark.
    temperature: 0.5
    num_ctx: 4096 # Keep this modest for chunk generation; VRAM scales with context and parallelism.

embeddings:
  model_name: BAAI/bge-m3
  batch_size: 128
  device: cuda # Single-device fallback. Use cuda:0/cuda:1 if you want one explicit GPU.
  devices: [] # Optional data-parallel devices, e.g. [cuda:0, cuda:1] on a 2-GPU Kaggle runtime.
  query_prompt: null # Optional query prompt passed to the Embedder for models that require one.
  document_prompt: null # Optional document prompt passed to the Embedder for models that require one.
  normalize: true

retrieval:
  strategies: [top_k, mmr, fac_loc]
  pool_scope: query_local
  candidate_pool_n: 10_000 # Top-N candidate pool retained before reranking by top-k/MMR/FacLoc.
  k_values: [4, 5, 6, 7, 8, 9]
  lambdas_mmr: # MMR uses lambda on its full relevance-diversity scale.
    start: 0.02
    stop: 0.90
    num_values: 30
  lambdas_fac_loc: # FacLoc reaches useful coverage behavior on a lower raw-lambda scale.
    start: 0.01
    stop: 0.40
    num_values: 30
  mmr_window: null # Optional MMR candidate window. null means MMR can choose from the whole top-N pool.
  compute_answer_rouge: true # If false, skip answer-ROUGE metric computation and omit ROUGE-based plots.
  only_pass_geometry: true # If true, evaluation skips queries that fail the geometric prefilter.

geometry_filter:
  topk_k: 20 # k used by the strict geometry gate; match the main RAG context budget.
  min_primary_axis_count: 14 # Minimum number of top-20 results from the declared primary axis.
  max_topk_retrieved_facets: 2 # Maximum distinct gold facets represented in the top-k geometry window.
  min_in_minus_cross_similarity: 0.03 # Required separation between mean in-facet and cross-facet cosine similarity.
  min_same_axis_cohort_gap: 0.03
  min_same_cohort_axis_gap: 0.03
  min_distractors_in_pool: 10 # Minimum number of hard distractors in the candidate pool.

evaluation:
  all_clean_rate_precision_threshold: 0.8 # Minimum Precision@k required, with full facet coverage, for AllFacetCleanRate@k.
  lambda_selection:
    tie_break: lower_lambda # Representative lambda always maximizes FacetCoveragePurity@k; use this only to break exact ties.
  fac_loc_mmr_comparison_kernels:
    lambda_max: 0.80 # Ignore near-top-k lambda pairs in the FacLoc/MMR agreement sweep.
    agreement_alpha: 3.0 # Exponent applied to the inverse quality-kernel penalty; larger is more aggressive.
    kernel_floor: 0.05 # Caps the maximum penalty and prevents division by zero.
    pair_aggregation: geometric_mean # How to combine FacLoc and MMR kernel scores into one pair score.
    metrics:
      - summary_metric: FacetCoverage@k
        enabled: true
        weight: 1.0
        target_gain_vs_topk: 0.08 # Soft threshold for "meaningfully better than top-k".
        gain_bandwidth: 0.01 # Smaller = sharper transition around target_gain_vs_topk.
        target_lower_bound_vs_topk: 0.03 # Require a clearly positive paired 95% CI lower bound.
        lower_bound_bandwidth: 0.0075

query_geometry:
  random_state: 42 # Seed for PCA/UMAP figure reproducibility.

  # Number of query-local embedding maps to generate after evaluation.
  # Each selected query gets UMAP/PCA plots, query-cosine color maps, rank plots, and HDBSCAN plots.
  n_queries: 6

  # Optional explicit query IDs. If empty, representative queries are chosen automatically
  # using query_selection.
  query_ids: []
  query_selection: mixed # "mixed" = good/mid/bad ranking slices; "best" = old good-query ranking only.

  # Candidate pool size for embedding-geometry plots.
  # null means reuse retrieval.candidate_pool_n.
  candidate_pool_n: null

  # k used when overlaying top-k/MMR/FacLoc selected points on the scatter plot.
  plot_k: 10
  reduction: umap # "umap" | "pca"
  umap_metric: cosine # Use cosine for normalized semantic embeddings. Euclidean is mainly useful for debugging PCA maps.
  pca_dims: null # null = direct embedding features; integer = PCA to this many dimensions before UMAP.
  umap_neighbors: 15 # UMAP neighborhood size. Smaller values show local clusters; larger values preserve broader structure.
  umap_min_dist: 0.08 # UMAP minimum distance. Smaller values create tighter visual clusters.

  hdbscan_umap_dims: 10 # HDBSCAN runs on this many UMAP components; plotting still uses the 2D UMAP/PCA map.
  hdbscan_min_cluster_size: 5
  hdbscan_min_samples: null
