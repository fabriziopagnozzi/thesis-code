query_templates:
  - id: primary_evidence_comparison
    template: "For patients with {condition}, compare {subgroup_a} with {subgroup_b} primarily by {primary_axis_label}. For each cohort, determine {primary_axis_focus}. Base the main comparison on this {primary_axis_label} evidence. Briefly add {secondary_axis_label} as a secondary endpoint."
  - id: primary_endpoint_assessment
    template: "In {condition}, the primary comparison between {subgroup_a} and {subgroup_b} is {primary_axis_label}. For each cohort, identify {primary_axis_focus}. The {primary_axis_label} evidence should drive the comparison; {secondary_axis_label} is supplementary context."
  - id: primary_clinical_contrast
    template: "Compare {subgroup_a} and {subgroup_b} with {condition} primarily by {primary_axis_label}: identify {primary_axis_focus}. Report this {primary_axis_label} comparison first and in detail. Add only a brief secondary note about {secondary_axis_label}."

answer_template:
  template: "Primary endpoint ({primary_axis_label}): {subgroup_a}, {subgroup_a_primary}; {subgroup_b}, {subgroup_b_primary}. Secondary endpoint ({secondary_axis_label}): {subgroup_a}, {subgroup_a_secondary}; {subgroup_b}, {subgroup_b_secondary}."
