query_templates:
  unbalanced:
    list:
      - id: primary_evidence_comparison
        template: "For patients with {condition}, compare {subgroup_a} and {subgroup_b}. Start by summarizing {primary_axis_label}; for each cohort, identify {primary_axis_focus}. Then add a short {secondary_axis_label} summary for the same two cohorts."

      - id: primary_endpoint_assessment
        template: "In the {condition} records, compare {primary_axis_label} for {subgroup_a} versus {subgroup_b}. Separate the cohorts and identify {primary_axis_focus}; include {secondary_axis_label} afterward as context."

      - id: primary_clinical_contrast
        template: "For a cohort summary of {condition}, contrast {subgroup_a} versus {subgroup_b} by first summarizing {primary_axis_label}. For each cohort, determine {primary_axis_focus}, and then briefly note the {secondary_axis_label} pattern."

      - id: chart_review_focus_then_context
        template: "Review the {condition} cases for {subgroup_a} versus {subgroup_b}. Lead with the {primary_axis_label} findings, including {primary_axis_focus} for each cohort, and use {secondary_axis_label} only as follow-up context."

      - id: discharge_summary_comparison
        template: "Using the {condition} discharge summaries, compare {subgroup_a} and {subgroup_b}. Emphasize {primary_axis_label} by identifying {primary_axis_focus} in both cohorts; after that, add the relevant {secondary_axis_label} evidence."

      - id: handoff_question
        template: "I need a handoff-style comparison for patients with {condition}: how do {subgroup_a} and {subgroup_b} differ in {primary_axis_label}? For each cohort, identify {primary_axis_focus}, then add a concise note on {secondary_axis_label}."

    natural:
      - id: primary_evidence_comparison
        template: "For patients with {condition}, compare {subgroup_a} and {subgroup_b}. Use {primary_axis_label} as the main lens by summarizing {primary_axis_focus} for each cohort. Then add a brief contextual note on {secondary_axis_label}."

      - id: primary_endpoint_assessment
        template: "In the {condition} records, compare {subgroup_a} versus {subgroup_b}. Lead with {primary_axis_label}, using the notes to characterize {primary_axis_focus} in each cohort. Include {secondary_axis_label} afterward as brief context."

      - id: primary_clinical_contrast
        template: "For a cohort summary of {condition}, contrast {subgroup_a} versus {subgroup_b} through {primary_axis_label}. Summarize {primary_axis_focus} first, and then briefly describe the related {secondary_axis_label} evidence."

      - id: chart_review_focus_then_context
        template: "Review the {condition} cases for {subgroup_a} versus {subgroup_b}. Lead with {primary_axis_label} by extracting evidence about {primary_axis_focus}. Use {secondary_axis_label} as follow-up context."

      - id: discharge_summary_comparison
