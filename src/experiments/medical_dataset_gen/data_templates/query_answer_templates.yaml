query_templates:
  prioritized_subgroup_comparison:
    - id: prioritized_comparison
      template: "For patients with {condition}, primarily compare {primary_axis_label} between {subgroup_a} and {subgroup_b}; also compare {secondary_axis_label} for both cohorts."
    - id: prioritized_comparison_assess
      template: "Among patients with {condition}, assess {primary_axis_label} as the primary endpoint for {subgroup_a} versus {subgroup_b}, and include {secondary_axis_label} as a secondary endpoint."
    - id: prioritized_comparison_contrast
      template: "In {condition}, how does {primary_axis_label} differ between {subgroup_a} and {subgroup_b}, and what secondary difference is seen in {secondary_axis_label}?"

answer_templates:
  prioritized_subgroup_comparison:
    template: "Primary endpoint ({primary_axis_label}): {subgroup_a}, {subgroup_a_primary}; {subgroup_b}, {subgroup_b_primary}. Secondary endpoint ({secondary_axis_label}): {subgroup_a}, {subgroup_a_secondary}; {subgroup_b}, {subgroup_b_secondary}."
