            cohort_b_bins:
                - home_rehab
                - ward_level
          - id: crossover_tradeoff
            cohort_a_bins:
                - home_rehab
                - intensive_care
            cohort_b_bins:
                - persistent_deficit
                - ward_level
    - axes:
          - complication_burden
          - acute_clinical_course
      allowed_primary_axes: []
      rationale: complication burden and acute clinical course repeatedly collapse into the same uncomplicated-versus-complicated admission trajectory. Neither orientation produced stable four-facet retrieval geometry across embedding models, so the pair is suppressed in the main benchmark.
      profiles:
          - id: low_high
            cohort_a_bins:
                - none_documented
                - early_stabilization
            cohort_b_bins:
                - major_complication
                - refractory_or_worsening
          - id: high_low
            cohort_a_bins:
                - limited_complication
                - delayed_improvement
            cohort_b_bins:
                - none_documented
                - early_stabilization
    - axes:
          - complication_burden
          - care_intensity
      allowed_primary_axes: []
      rationale: complication burden and highest care setting both encode acute resource escalation, so this pair is suppressed until care-setting evidence shows stable separation from adverse-event burden.
