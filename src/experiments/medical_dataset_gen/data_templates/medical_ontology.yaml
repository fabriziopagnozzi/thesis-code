    acute_clinical_course:
        label: acute clinical course
        query_label: acute clinical course
        allow_as_primary: true
        query_focus:
            list: whether the patient had early stabilization, delayed improvement, or a refractory or worsening course
            natural: the admission trajectory, including the pace of stabilization and any continued deterioration despite treatment
        exact_terms:
            - acute clinical course
            - clinical response trajectory
        synonym_terms:
            - inpatient response pattern
            - stabilization trajectory
        bins:
            - early_stabilization
            - delayed_improvement
            - refractory_or_worsening
        bin_terms:
            early_stabilization:
                - early clinical stabilization
                - prompt response trajectory
                - prompt improvement
                - early clinical response
                - rapid inpatient stabilization
            delayed_improvement:
                - delayed clinical improvement
                - slow response trajectory
                - slow improvement
                - slower clinical recovery
                - delayed inpatient response
            refractory_or_worsening:
                - refractory response trajectory
                - worsening response trajectory
                - persistent symptoms despite initial therapy
                - worsening disease signs on serial assessment
                - limited response to initial management
    care_intensity:
        label: highest care setting
        query_label: care intensity
        allow_as_primary: true
        query_focus:
            list: whether the admission stayed on a routine ward, required a step-down or telemetry-capable monitored bed, or required an ICU bed with critical-care monitoring
            natural: the level of monitoring, nursing resources, and organ-support readiness required during hospitalization
        exact_terms:
            - care intensity
            - highest care setting
            - inpatient care setting
            - hospital unit level
        synonym_terms:
            - care-setting level
            - monitored-bed requirement
            - unit-level resource use
        bins:
            - ward_level
            - monitored_bed
            - intensive_care
        bin_terms:
            ward_level:
                - routine ward-bed care
                - general medical floor care
                - standard ward-unit management
                - floor-level inpatient care
            monitored_bed:
                - step-down or telemetry-capable monitoring
                - monitored bed care
                - step-down-unit observation
                - telemetry-capable inpatient care
                - higher-frequency monitored-bed assessment
                - intermediate-care-unit monitoring
            intensive_care:
                - ICU-bed care
                - critical-care unit management
                - continuous ICU monitoring
                - ICU-level nursing with continuous cardiorespiratory review
                - critical-care staffing with continuous bedside monitoring
    diagnostic_evidence_type:
        label: dominant diagnostic evidence modality
        query_label: diagnostic evidence type
        allow_as_primary: false
        query_focus:
            list: whether diagnosis was supported mainly by bedside or laboratory findings, imaging or visual evidence, or specimen-based or specialized testing
            natural: which form of clinical evidence carried the diagnosis in the note
        exact_terms:
            - diagnostic evidence source
            - diagnostic evidence type
            - diagnostic support pattern
        synonym_terms:
            - diagnostic basis
            - evidence source for diagnosis
            - confirmatory evidence pattern
        bins:
            - bedside_laboratory_pattern
            - structural_visual_evidence
            - specimen_or_specialized_test
        bin_terms:
            bedside_laboratory_pattern:
                - bedside and laboratory diagnostic pattern
                - clinical-laboratory evidence pattern
                - symptom and laboratory diagnostic support
                - bedside examination plus laboratory evidence
            structural_visual_evidence:
                - structural or visual diagnostic evidence
                - imaging or visualization-supported diagnosis
                - visualized anatomic evidence
                - structural diagnostic confirmation
            specimen_or_specialized_test:
                - specimen or specialized diagnostic testing
                - microbiology pathology or specialized test evidence
                - confirmatory specimen-based evidence
                - specialized diagnostic test support
