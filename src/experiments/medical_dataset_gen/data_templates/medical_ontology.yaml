                axis: treatment_duration
                bins:
                    short:
                        - 5
                        - 7
                    standard:
                        - 10
                        - 14
                    prolonged:
                        - 21
                        - 28
                treatments:
                    - acyclovir
                    - corticosteroids
            rehab_outcome:
                axis: rehab_outcome
                bins:
                    home_rehab:
