                        - persistent focal deficits requiring close neurologic follow-up
                        - ongoing weakness and impaired balance
                        - persistent cognitive slowing or gait ataxia requiring close neurology follow-up
                        - ongoing cognitive slowing or gait ataxia with reduced walking tolerance
                        - residual functional limitation after encephalitis or myelitis
                        - continued symptoms from encephalitis or myelitis limiting independent activity
            complication_burden:
                axis: complication_burden
                bins:
                    none_documented:
                        - no seizure, aspiration event, or treatment-limiting toxicity
                        - no unplanned ICU transfer, procedure complication, or treatment-limiting adverse effect during encephalitis or myelitis care
                        - no recurrent clinical decline or organ-support requirement while treating encephalitis or myelitis
                        - no documented major complication during the encephalitis or myelitis admission
                        - no major bleeding, sepsis escalation, or medication-limiting toxicity
                        - no organ-support requirement, major bleeding, or treatment-limiting toxicity during encephalitis or myelitis care
                        - no unplanned escalation for hemodynamic, respiratory, neurologic, or procedural complication
                    limited_complication:
                        - a transient acyclovir-related creatinine rise that resolved
                        - a self-limited inpatient issue during encephalitis or myelitis care that improved with monitoring
                        - a mild electrolyte or laboratory abnormality corrected before discharge
                        - temporary medication adjustment for a manageable adverse effect
                        - brief clinical instability that resolved with supportive care
                        - a transient treatment-related issue that improved without ICU transfer
                        - a manageable inpatient complication that resolved before discharge planning
                    major_complication:
                        - a breakthrough seizure requiring escalation of management
                        - clinical deterioration from encephalitis or myelitis requiring high-acuity support
                        - organ dysfunction or shock requiring critical-care reassessment
                        - a treatment-limiting adverse event requiring a major management change
                        - a severe complication of encephalitis or myelitis requiring procedural or intensive support
                        - severe encephalitis or myelitis-related decompensation requiring urgent escalation
                        - a major inpatient adverse event requiring high-acuity or procedural support
            acute_clinical_course:
                axis: acute_clinical_course
                bins:
                    early_stabilization:
                        - prompt improvement in mentation and neurologic examination
                        - prompt improvement in mentation and neurologic examination soon after initial treatment
                        - early stabilization of encephalitis or myelitis symptoms after therapy began
                        - prompt improvement in vital signs and bedside clinical assessment
                        - rapid inpatient response after management for encephalitis or myelitis
                        - stable examination and improving functional status within the early hospital course
                    delayed_improvement:
                        - slow improvement in mentation with residual weakness
                        - slow improvement in mentation with residual weakness over several hospital days
                        - gradual recovery after initial treatment for encephalitis or myelitis
                        - slow improvement in symptoms with persistent inpatient monitoring needs
                        - stepwise clinical improvement rather than an immediate response
                        - delayed recovery of mobility and physiologic stability
                    refractory_or_worsening:
                        - worsening neurologic findings despite initial therapy
                        - worsening neurologic findings despite initial therapy during the early hospital course
                        - worsening clinical status despite initial management for encephalitis or myelitis
                        - persistent instability requiring reassessment of the treatment plan
                        - progressive symptoms prompting escalation of inpatient evaluation
                        - failure to stabilize with concern for uncontrolled disease activity
            care_intensity:
                axis: care_intensity
                bins:
                    ward_level:
                        - neurology-ward care with routine neurologic checks
                        - ward-level care for encephalitis or myelitis with routine monitoring
                        - general ward-bed management with scheduled laboratory review
                        - standard floor care coordinated with therapy and discharge planning
                        - routine ward-bed management with standard nursing assessments
                        - floor-based medication adjustment with scheduled bedside reassessment
                    monitored_or_procedural:
                        - step-down neurologic monitoring with frequent neurologic checks
                        - step-down monitoring during encephalitis or myelitis management
                        - step-down-unit observation with higher-frequency bedside checks
                        - telemetry or monitored-unit care with scheduled rhythm and vital-sign review
                        - monitored inpatient management in a step-down or telemetry-capable setting
                        - higher-frequency nursing assessment in a monitored bed
                    intensive_care:
                        - neuro-ICU bed with continuous neurologic and airway-capable monitoring
                        - ICU-bed management during encephalitis or myelitis care with critical-care staffing
                        - critical-care unit management with continuous monitoring and organ-support capability
                        - intensive monitoring with organ-support capability
                        - ICU-level nursing and respiratory or hemodynamic support during encephalitis or myelitis treatment
                        - ICU-bed care with continuous monitoring and rapid-response capability
        presentations:
            - several days of fever, confusion, and gait instability
            - headache, altered mental status, and lower-extremity weakness
            - new focal neurologic deficits and inflammatory cerebrospinal fluid findings
