axis_pairs:
    - axes:
          - treatment_duration
          - rehab_outcome
      profiles:
          - id: low_high
            cohort_a_bins:
                - short
                - home_rehab
            cohort_b_bins:
                - prolonged
                - inpatient_rehab
          - id: high_low
            cohort_a_bins:
                - prolonged
                - persistent_deficit
            cohort_b_bins:
                - standard
                - home_rehab
          - id: crossover_tradeoff
            cohort_a_bins:
                - short
                - persistent_deficit
            cohort_b_bins:
                - prolonged
                - home_rehab
    - axes:
          - treatment_duration
          - complication_burden
      profiles:
          - id: low_high
            cohort_a_bins:
                - short
                - none_documented
            cohort_b_bins:
                - prolonged
                - major_complication
          - id: high_low
            cohort_a_bins:
                - prolonged
                - limited_complication
            cohort_b_bins:
                - standard
                - none_documented
    - axes:
          - treatment_duration
          - acute_clinical_course
      profiles:
          - id: low_high
            cohort_a_bins:
                - short
                - early_stabilization
            cohort_b_bins:
                - prolonged
                - refractory_or_worsening
          - id: high_low
            cohort_a_bins:
                - prolonged
                - delayed_improvement
            cohort_b_bins:
                - standard
                - early_stabilization
          - id: crossover_tradeoff
            cohort_a_bins:
                - standard
                - refractory_or_worsening
            cohort_b_bins:
                - prolonged
                - early_stabilization
    - axes:
          - treatment_duration
          - care_intensity
      profiles:
          - id: low_high
            cohort_a_bins:
                - short
                - ward_level
            cohort_b_bins:
                - prolonged
                - intensive_care
          - id: high_low
            cohort_a_bins:
                - prolonged
                - monitored_or_procedural
            cohort_b_bins:
                - standard
                - ward_level
          - id: crossover_tradeoff
            cohort_a_bins:
                - short
                - intensive_care
            cohort_b_bins:
                - prolonged
                - ward_level
    - axes:
          - rehab_outcome
          - complication_burden
      allowed_primary_axes:
          - rehab_outcome
      rationale: rehabilitation outcome remains a distinct discharge-time target, but complication burden is too often just a weaker restatement of the same uncomplicated-versus-complicated hospital course when used as the primary retrieval axis.
      profiles:
          - id: low_high
            cohort_a_bins:
                - home_rehab
                - none_documented
            cohort_b_bins:
                - inpatient_rehab
                - major_complication
          - id: high_low
            cohort_a_bins:
                - persistent_deficit
                - limited_complication
            cohort_b_bins:
                - home_rehab
                - none_documented
    - axes:
          - rehab_outcome
          - acute_clinical_course
      allowed_primary_axes: []
      rationale: discharge rehabilitation need and acute response trajectory were empirically too tightly coupled for stable multi-cluster retrieval, so this pair is suppressed in the bundled ontology rather than repeated as a config override.
      profiles:
          - id: low_high
            cohort_a_bins:
                - home_rehab
                - early_stabilization
            cohort_b_bins:
                - persistent_deficit
                - refractory_or_worsening
          - id: high_low
            cohort_a_bins:
                - inpatient_rehab
                - delayed_improvement
            cohort_b_bins:
                - home_rehab
                - early_stabilization
    - axes:
          - rehab_outcome
          - care_intensity
      allowed_primary_axes:
          - rehab_outcome
      rationale: rehabilitation outcome remains the dominant discharge-time target because highest-care-setting-primary queries in this pair collapse too easily into a broad admission-severity narrative.
      profiles:
          - id: low_high
            cohort_a_bins:
                - home_rehab
                - ward_level
            cohort_b_bins:
                - inpatient_rehab
                - intensive_care
          - id: high_low
            cohort_a_bins:
                - persistent_deficit
                - monitored_or_procedural
            cohort_b_bins:
                - home_rehab
                - ward_level
          - id: crossover_tradeoff
            cohort_a_bins:
                - home_rehab
                - intensive_care
            cohort_b_bins:
                - persistent_deficit
                - ward_level
    - axes:
          - complication_burden
          - acute_clinical_course
      allowed_primary_axes:
          - acute_clinical_course
      rationale: complication burden and acute clinical course can share the same latent admission-course severity signal, so complication burden is not permitted as the dominant retrieval axis for this pair.
      condition_overrides:
          - condition_id: multiple_sclerosis_relapse
            allowed_primary_axes: []
            rationale: in multiple sclerosis relapse, relapse response and steroid or plasma-exchange complications collapse too easily into a single uncomplicated-versus-complicated admission narrative.
      profiles:
          - id: low_high
            cohort_a_bins:
                - none_documented
                - early_stabilization
            cohort_b_bins:
                - major_complication
                - refractory_or_worsening
          - id: high_low
            cohort_a_bins:
                - limited_complication
                - delayed_improvement
            cohort_b_bins:
                - none_documented
                - early_stabilization
    - axes:
          - complication_burden
          - care_intensity
      allowed_primary_axes: []
      rationale: complication burden and highest care setting both encode acute resource escalation, so this pair is suppressed until care-setting evidence shows stable separation from adverse-event burden.
      profiles:
          - id: low_high
            cohort_a_bins:
                - none_documented
                - ward_level
            cohort_b_bins:
                - major_complication
                - intensive_care
          - id: high_low
            cohort_a_bins:
                - limited_complication
                - monitored_or_procedural
            cohort_b_bins:
                - none_documented
                - ward_level
    - axes:
          - acute_clinical_course
          - care_intensity
      allowed_primary_axes:
          - acute_clinical_course
      rationale: acute-course-primary queries remain usable, but highest-care-setting-primary queries for this pair collapse too easily into the same stabilization-versus-worsening narrative.
      profiles:
          - id: low_high
            cohort_a_bins:
                - early_stabilization
                - ward_level
            cohort_b_bins:
                - refractory_or_worsening
                - intensive_care
          - id: high_low
            cohort_a_bins:
                - delayed_improvement
                - monitored_or_procedural
            cohort_b_bins:
                - early_stabilization
                - ward_level
