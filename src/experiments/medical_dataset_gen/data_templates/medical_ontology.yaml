    - axes:
          - rehab_outcome
          - complication_burden
      allowed_primary_axes:
          - rehab_outcome
      rationale: rehabilitation outcome remains a distinct discharge-time target, but complication burden is too often just a weaker restatement of the same uncomplicated-versus-complicated hospital course when used as the primary retrieval axis.
      profiles:
          - id: low_high
            cohort_a_bins:
                - home_rehab
                - none_documented
            cohort_b_bins:
                - inpatient_rehab
                - major_complication
          - id: high_low
            cohort_a_bins:
                - persistent_deficit
                - limited_complication
            cohort_b_bins:
                - home_rehab
                - none_documented
    - axes:
          - rehab_outcome
          - acute_clinical_course
      allowed_primary_axes: []
      rationale: discharge rehabilitation need and acute response trajectory were empirically too tightly coupled for stable multi-cluster retrieval, so this pair is suppressed in the bundled ontology rather than repeated as a config override.
      profiles:
          - id: low_high
            cohort_a_bins:
                - home_rehab
                - early_stabilization
            cohort_b_bins:
                - persistent_deficit
                - refractory_or_worsening
          - id: high_low
            cohort_a_bins:
                - inpatient_rehab
                - delayed_improvement
            cohort_b_bins:
                - home_rehab
                - early_stabilization
    - axes:
          - rehab_outcome
          - care_intensity
      allowed_primary_axes:
          - rehab_outcome
      rationale: rehabilitation outcome remains the dominant discharge-time target because highest-care-setting-primary queries in this pair collapse too easily into a broad admission-severity narrative.
      profiles:
          - id: low_high
            cohort_a_bins:
                - home_rehab
                - ward_level
            cohort_b_bins:
                - inpatient_rehab
                - intensive_care
          - id: high_low
            cohort_a_bins:
                - persistent_deficit
