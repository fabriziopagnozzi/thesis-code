conditions:
    encephalitis_myelitis:
        display: encephalitis or myelitis
        allowed_comorbidity_contrast_ids:
            - immunosuppression_present_vs_absent
            - malignancy_present_vs_absent
            - autoimmune_present_vs_absent
        allowed_distinct_comorbidity_contrasts:
            - id: immunosuppression_vs_malignancy
              cohort_a_id: immunosuppression
              cohort_b_id: malignancy
            - id: immunosuppression_vs_autoimmune_disease
              cohort_a_id: immunosuppression
              cohort_b_id: autoimmune_disease
        terms:
            - encephalitis
            - myelitis
            - neurologic deficit
            - acyclovir
        axis_values:
            acute_clinical_course:
                axis: acute_clinical_course
                bins:
                    early_stabilization:
                        - prompt improvement in encephalitis or myelitis symptoms after treatment began
                        - early response on serial bedside assessment
                        - rapid improvement in presenting findings
                        - prompt reduction in disease activity on serial evaluation
                        - early clinical response during the hospital course
                    delayed_improvement:
                        - gradual improvement in encephalitis or myelitis symptoms over several days
                        - slow response on serial bedside assessment
                        - delayed improvement in presenting findings
                        - stepwise symptom improvement rather than an immediate response
                        - persistent symptoms before a later clinical response
                    refractory_or_worsening:
                        - persistent encephalitis or myelitis symptoms despite initial treatment
                        - worsening disease signs on serial assessment
                        - limited response to initial management
                        - continued presenting findings despite early treatment
                        - refractory disease activity on serial evaluation
            rehab_outcome:
                axis: rehab_outcome
                bins:
                    home_rehab:
                        - outpatient neurorehabilitation
                        - home therapy with improving gait stability
                        - home therapy focused on balance and cognitive recovery
                        - outpatient rehabilitation after encephalitis or myelitis symptoms improved
                        - visiting nursing with gradual activity advancement after encephalitis or myelitis
                        - home exercise and safety review for residual cognitive slowing or gait ataxia
                    inpatient_rehab:
                        - inpatient rehabilitation for persistent weakness
                        - acute rehabilitation for mobility and cognitive deficits
                        - inpatient rehabilitation for myelopathic weakness and unsafe gait
                        - facility-based therapy after hospitalization for encephalitis or myelitis
                        - acute rehabilitation when cognitive slowing or gait ataxia limited safe transfers
                        - supervised rehabilitation for deconditioning and cognitive slowing or gait ataxia
                    persistent_deficit:
                        - persistent focal deficits requiring close neurologic follow-up
                        - ongoing weakness and impaired balance
                        - persistent cognitive slowing or gait ataxia requiring close neurology follow-up
                        - ongoing cognitive slowing or gait ataxia with reduced walking tolerance
                        - residual functional limitation after encephalitis or myelitis
                        - continued symptoms from encephalitis or myelitis limiting independent activity
            complication_burden:
                axis: complication_burden
                bins:
                    none_documented:
                        - no documented major complication during the encephalitis or myelitis admission
                        - no treatment-limiting medication toxicity during encephalitis or myelitis care
                        - no major bleeding or new inpatient adverse event
                        - no therapy-limiting laboratory toxicity during encephalitis or myelitis care
                        - no serious adverse event documented before discharge
                    limited_complication:
                        - a transient acyclovir-related creatinine rise that resolved
                        - a manageable adverse medication effect corrected before discharge
                        - a self-limited fluid, electrolyte, or laboratory issue
                        - brief treatment adjustment for a nonserious adverse effect
                        - a minor inpatient complication documented as resolved
                    major_complication:
                        - breakthrough seizure requiring antiseizure medication change
                        - aspiration event complicating neurologic care
                        - a treatment-limiting adverse event requiring a major regimen change
                        - a serious inpatient adverse event documented during encephalitis or myelitis care
                        - a major medication toxicity requiring therapy revision
            care_intensity:
                axis: care_intensity
                bins:
                    ward_level:
                        - ward-level care for encephalitis or myelitis with routine vital-sign review
                        - general ward-bed management during encephalitis or myelitis care
                        - standard floor care with scheduled nursing assessments
                        - routine ward-bed management with scheduled laboratory review
                        - floor-based medication adjustment with scheduled bedside reassessment
                    monitored_bed:
                        - step-down or telemetry-capable bed during encephalitis or myelitis care
                        - monitored-bed care for encephalitis or myelitis with frequent bedside checks
                        - step-down-unit observation with higher-frequency vital-sign review
                        - telemetry-capable inpatient care with scheduled rhythm review
                        - higher-frequency nursing assessment in a monitored bed
                    intensive_care:
                        - ICU bed during encephalitis or myelitis care with continuous bedside observation
                        - critical-care unit staffing during encephalitis or myelitis care
                        - ICU-level nursing with continuous cardiorespiratory review
                        - critical-care bed with continuous vital-sign review
                        - ICU-bed care with continuous bedside assessment
            diagnostic_evidence_type:
                axis: diagnostic_evidence_type
                bins:
                    bedside_laboratory_pattern:
                        - fever, confusion, focal weakness, and inflammatory blood tests
                        - neurologic examination with systemic inflammatory markers
                        - bedside mental-status changes with abnormal inflammatory labs
                    structural_visual_evidence:
                        - brain or spine MRI showing inflammatory neurologic lesions
                        - neuroimaging demonstrating parenchymal or cord signal abnormality
                        - MRI evidence matching encephalitic or myelitic localization
                    specimen_or_specialized_test:
                        - cerebrospinal fluid testing with inflammatory findings
                        - viral and autoimmune cerebrospinal fluid studies supporting the diagnosis
                        - lumbar-puncture results with specialized infectious testing
            treatment_duration:
                axis: treatment_duration
                treatments:
                    antiviral_course:
                        surface_forms:
                            - acyclovir
                            - intravenous acyclovir
                        bins:
                            short:
                                - 5
                                - 7
                            standard:
                                - 10
                                - 14
                            prolonged:
                                - 21
                                - 28
                    inpatient_immunotherapy_course:
                        surface_forms:
                            - corticosteroids
                            - intravenous methylprednisolone
                            - plasma-exchange therapy
                        bins:
                            short:
                                - 3
                                - 5
                            standard:
                                - 7
                                - 10
                            prolonged:
                                - 14
                                - 21
        presentations:
            - several days of fever, confusion, and gait instability
            - headache, altered mental status, and lower-extremity weakness
            - new focal neurologic deficits and inflammatory cerebrospinal fluid findings
