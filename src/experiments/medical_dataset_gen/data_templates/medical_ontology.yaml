            cohort_a_bins:
                - early_stabilization
                - ward_level
            cohort_b_bins:
                - refractory_or_worsening
                - intensive_care
          - id: high_low
            cohort_a_bins:
                - delayed_improvement
                - monitored_or_procedural
            cohort_b_bins:
                - early_stabilization
                - ward_level
