note_style_templates:
    admission_course:
        seen:
            - id: outer_admission_course_seen_1
              template: "{patient} was admitted with {condition} after {presentation}. {cohort_sentence} {axis_sentence}"
        heldout:
            - id: outer_admission_course_heldout_1
              template: "{patient} came in after {presentation} and was managed for {condition}. {axis_sentence} {cohort_sentence}"
    cohort_first:
        seen:
            - id: outer_cohort_first_seen_1
              template: "{cohort_sentence} {patient} presented with {presentation} and was treated for {condition}. {axis_sentence}"
        heldout:
            - id: outer_cohort_first_heldout_1
              template: "{cohort_sentence} In this hospitalization, {patient_lower} had {condition} after {presentation}. {axis_sentence}"
    embedded_course:
        seen:
            - id: outer_embedded_course_seen_1
              template: "{patient} presented with {presentation} and was treated for {condition}. {cohort_sentence} {axis_sentence}"
        heldout:
            - id: outer_embedded_course_heldout_1
              template: "After presentation with {presentation}, {patient_lower} was treated for {condition}. {axis_sentence} {cohort_sentence}"
    axis_first:
        seen:
            - id: outer_axis_first_seen_1
              template: "{axis_sentence} {patient} had been admitted for {condition} after {presentation}. {cohort_sentence}"
        heldout:
            - id: outer_axis_first_heldout_1
              template: "{axis_sentence} The same chart described {patient_lower} as hospitalized with {condition} after {presentation}. {cohort_sentence}"
    fragmented_note:
        seen:
            - id: outer_fragmented_note_seen_1
              template: "{patient}; presentation with {presentation}; working problem: {condition}. {cohort_sentence} Course detail: {axis_sentence}"
        heldout:
            - id: outer_fragmented_note_heldout_1
              template: "Patient: {patient_lower}. Reason for stay: {condition} after {presentation}. {cohort_sentence} Entry: {axis_sentence}"

cohort_evidence_templates:
    comorbidity_present:
        seen:
            - id: cohort_present_seen_1
              template: "{possessive_cap} established medical history included {subgroup_phrase}."
            - id: cohort_present_seen_2
              template: "At intake, {subgroup_phrase} was listed among active conditions."
            - id: cohort_present_seen_3
              template: "The admitting history carried {subgroup_phrase}."
        heldout:
            - id: cohort_present_heldout_1
              template: "Prior records noted {subgroup_phrase}."
            - id: cohort_present_heldout_2
              template: "Medication reconciliation and history review both referenced {subgroup_phrase}."
            - id: cohort_present_heldout_3
              template: "The chart background included {subgroup_phrase}."
    comorbidity_reference:
        seen:
            - id: cohort_reference_seen_1
              template: "Baseline comorbidity review documented {subgroup_phrase}."
            - id: cohort_reference_seen_2
              template: "Admission history noted {subgroup_phrase}."
            - id: cohort_reference_seen_3
              template: "The intake problem list recorded {subgroup_phrase}."
        heldout:
            - id: cohort_reference_heldout_1
              template: "Chart review before orders listed {subgroup_phrase}."
            - id: cohort_reference_heldout_2
              template: "The background history section carried {subgroup_phrase}."
            - id: cohort_reference_heldout_3
              template: "Pre-round review identified {subgroup_phrase}."

axis_sentence_templates:
    paired:
        treatment_duration:
            ontology_explicit_suffix: "The {axis_query_label} was classified as {axis_bin_term}."
            seen:
                direct_fact:
                    - id: treatment_duration_seen_direct_fact
                      template: "{pronoun_cap} completed {axis_value}; {treatment_completion_clause}."
                temporal_course:
                    - id: treatment_duration_seen_temporal_course
                      template: "The active treatment record shows {axis_value}; {treatment_completion_clause}."
                clinical_assessment:
                    - id: treatment_duration_seen_clinical_assessment
                      template: "After reassessment, the team documented {axis_value}; {treatment_completion_clause}."
                contrast_or_alternative:
                    - id: treatment_duration_seen_contrast_or_alternative
                      template: "{treatment_completion_clause_cap} after {axis_value}."
                fragmented_or_split_evidence:
                    - id: treatment_duration_seen_fragmented_or_split_evidence
                      template: "Treatment record: {axis_value}. {treatment_completion_clause_cap}."
            heldout:
                clinical_assessment:
                    - id: treatment_duration_heldout_clinical_assessment
                      template: "The active treatment record listed {axis_value}; {treatment_completion_clause}."
                contrast_or_alternative:
                    - id: treatment_duration_heldout_contrast_or_alternative
                      template: "Orders were reviewed after {axis_value}; {treatment_completion_clause}."
                fragmented_or_split_evidence:
                    - id: treatment_duration_heldout_fragmented_or_split_evidence
                      template: "Orders reviewed. Treatment record: {axis_value}. {treatment_completion_clause_cap}."
        rehab_outcome:
            ontology_explicit_suffix: "This {axis_query_label} corresponded to {axis_bin_term}."
            seen:
                direct_fact:
                    - id: rehab_outcome_seen_direct_fact
                      template: "The discharge plan listed {axis_value}."
                temporal_course:
                    - id: rehab_outcome_seen_temporal_course
                      template: "The final therapy note documented {axis_value}."
                clinical_assessment:
                    - id: rehab_outcome_seen_clinical_assessment
                      template: "Functional assessment before discharge noted {axis_value}."
                contrast_or_alternative:
