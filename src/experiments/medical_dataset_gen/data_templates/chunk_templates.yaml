note_style_templates:
    brief_hospital_course:
        - "{patient} was admitted with {condition} after {presentation}. {cohort_sentence} {axis_sentence}"
        - "{patient} was hospitalized for {condition} after presenting with {presentation}. {cohort_sentence} {axis_sentence}"
    progress_note:
        - During admission for {condition}, {patient_lower} was treated after presenting with {presentation}. {cohort_sentence} {axis_sentence}
        - "{patient} presented with {presentation} and was treated for {condition}. {cohort_sentence} {axis_sentence}"
    discharge_summary:
        - "{patient} was treated for {condition} after {presentation}. {cohort_sentence} {axis_sentence}"
        - Following presentation with {presentation}, {patient_lower} was managed for {condition}. {cohort_sentence} {axis_sentence}

cohort_evidence_templates:
    comorbidity_present:
        - "{possessive_cap} established medical history included {subgroup_phrase}."
        - "At admission, {subgroup_phrase} was an active comorbidity."
        - "{pronoun_cap} had a history of {subgroup_phrase}."
    comorbidity_reference:
        - "Baseline comorbidity review documented {subgroup_phrase}."
        - "Admission history noted {subgroup_phrase}."

axis_sentence_templates:
    ontology_explicit:
        treatment_duration:
            short:
                - "{pronoun_cap} completed {axis_value}. The treatment duration was brief, corresponding to a {axis_bin_term}."
                - "Active treatment ended after {axis_value}. This brief treatment duration constituted a {axis_bin_term}."
            standard:
                - "{pronoun_cap} completed {axis_value}. The treatment duration matched the usual interval and represented a {axis_bin_term}."
                - "Active treatment continued for {axis_value}. This treatment duration constituted a {axis_bin_term}."
            prolonged:
                - "{pronoun_cap} remained on active treatment for {axis_value}. This extended treatment duration represented a {axis_bin_term}."
                - "The full regimen required {axis_value}. The treatment duration was therefore a {axis_bin_term}."
        rehab_outcome:
            home_rehab:
                - "At discharge, the recovery plan was {axis_value}. This rehabilitation outcome was consistent with {axis_bin_term}."
                - "By discharge, {axis_value} had been arranged. The rehabilitation outcome was {axis_bin_term}."
            inpatient_rehab:
                - "At discharge, ongoing functional needs led to {axis_value}. In practical terms, {pronoun} required {axis_bin_term}."
                - "Because independent mobility remained unsafe, {axis_value} was arranged. This discharge plan involved {axis_bin_term}."
            persistent_deficit:
                - "At discharge, remaining functional problems included {axis_value}. The rehabilitation outcome was a {axis_bin_term}."
                - "Discharge assessment showed {axis_value}. This rehabilitation outcome reflected a {axis_bin_term}."
        complication_burden:
            none_documented:
