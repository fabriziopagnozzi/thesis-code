                - "The in-hospital complication burden consisted of {axis_value}. This manageable event represented {axis_bin_term}."
            major_complication:
                - "The admission was complicated by {axis_value}. This serious event resulted in {axis_bin_term}."
                - "During the hospital stay, {pronoun} developed {axis_value}. The resulting in-hospital complication burden was {axis_bin_term}."
