note_style_templates:
    brief_hospital_course:
        - "{patient} was admitted with {condition} after {presentation}. {cohort_sentence} {axis_sentence}"
        - "{patient} was hospitalized for {condition} after presenting with {presentation}. {cohort_sentence} {axis_sentence}"
    progress_note:
        - During admission for {condition}, {patient_lower} was treated after presenting with {presentation}. {cohort_sentence} {axis_sentence}
        - "{patient} presented with {presentation} and was treated for {condition}. {cohort_sentence} {axis_sentence}"
    discharge_summary:
        - "{patient} was treated for {condition} after {presentation}. {cohort_sentence} {axis_sentence}"
        - Following presentation with {presentation}, {patient_lower} was managed for {condition}. {cohort_sentence} {axis_sentence}

cohort_evidence_templates:
    comorbidity_present:
        - "{possessive_cap} established medical history included {subgroup_phrase}."
        - "At admission, {subgroup_phrase} was an active comorbidity."
        - "{pronoun_cap} had a history of {subgroup_phrase}."
    comorbidity_reference:
        - "Baseline comorbidity review documented {subgroup_phrase}."
        - "Admission history noted {subgroup_phrase}."

axis_sentence_templates:
    treatment_duration:
        short:
            - "{pronoun_cap} completed {axis_value}. The treatment duration was brief, corresponding to a {axis_bin_term}."
            - "Active treatment ended after {axis_value}. This brief treatment duration constituted a {axis_bin_term}."
        standard:
            - "{pronoun_cap} completed {axis_value}. The treatment duration matched the usual interval and represented a {axis_bin_term}."
            - "Active treatment continued for {axis_value}. This treatment duration constituted a {axis_bin_term}."
        prolonged:
            - "{pronoun_cap} remained on active treatment for {axis_value}. This extended treatment duration represented a {axis_bin_term}."
            - "The full regimen required {axis_value}. The treatment duration was therefore a {axis_bin_term}."
    rehab_outcome:
        home_rehab:
            - "At discharge, the recovery plan was {axis_value}. This rehabilitation outcome was consistent with {axis_bin_term}."
            - "By discharge, {axis_value} had been arranged. The rehabilitation outcome was {axis_bin_term}."
        inpatient_rehab:
            - "At discharge, ongoing functional needs led to {axis_value}. In practical terms, {pronoun} required {axis_bin_term}."
            - "Because independent mobility remained unsafe, {axis_value} was arranged. This discharge plan involved {axis_bin_term}."
        persistent_deficit:
            - "At discharge, remaining functional problems included {axis_value}. The rehabilitation outcome was a {axis_bin_term}."
            - "Discharge assessment showed {axis_value}. This rehabilitation outcome reflected a {axis_bin_term}."
    complication_burden:
        none_documented:
            - "During the admission, {pronoun} had {axis_value}. Overall, there was {axis_bin_term}."
            - "The hospital stay was free of a serious adverse event: {axis_value}. There was {axis_bin_term} during the admission."
        limited_complication:
            - "During the admission, {pronoun} developed {axis_value}. This transient event did not require major escalation and represented {axis_bin_term}."
            - "The in-hospital complication burden consisted of {axis_value}. This manageable event represented {axis_bin_term}."
        major_complication:
            - "The admission was complicated by {axis_value}. This serious event resulted in {axis_bin_term}."
            - "During the hospital stay, {pronoun} developed {axis_value}. The resulting in-hospital complication burden was {axis_bin_term}."
    acute_clinical_course:
        early_stabilization:
            - "Early in the admission, {pronoun} showed {axis_value}. This prompt response was consistent with {axis_bin_term} during the acute clinical course."
            - "{axis_value} occurred soon after management began. The acute clinical course therefore showed {axis_bin_term}."
        delayed_improvement:
            - "Improvement was not immediate; {pronoun} had {axis_value}. This acute clinical course represented {axis_bin_term}."
            - "The early response remained incomplete, with {axis_value}. The acute clinical course was characterized by {axis_bin_term}."
        refractory_or_worsening:
            - "During the admission, {pronoun} experienced {axis_value}. This failure to stabilize was consistent with {axis_bin_term} in the acute clinical course."
            - "Serial assessment showed {axis_value}. The acute clinical course was therefore {axis_bin_term}."
    care_intensity:
        ward_level:
            - "Throughout the admission, {pronoun} received {axis_value}. The highest care intensity remained {axis_bin_term}."
            - "Management consisted of {axis_value}, without a need for higher-acuity support. This corresponded to {axis_bin_term}."
        monitored_or_procedural:
            - "The admission required {axis_value}. This level of monitoring and intervention represented {axis_bin_term}."
            - "{pronoun_cap} received {axis_value}. This need defined the highest care intensity as {axis_bin_term}."
        intensive_care:
            - "Clinical needs escalated to {axis_value}. The highest care intensity was therefore {axis_bin_term}."
            - "{pronoun_cap} required {axis_value} during the admission. This represented {axis_bin_term}."

duration_phrase_templates:
    - "{duration_days} days of {treatment}"
    - "{duration_days} days of therapy with {treatment}"
    - "a {duration_days}-day course of {treatment}"

hidden_benchmark_terms:
    - admission adm_
    - benchmark
    - chunk
    - cohort descriptor
    - distractor
    - facet
    - gold
    - index terms
    - qrel
    - source query
    - structured cohort
    - synthetic
    - target query
