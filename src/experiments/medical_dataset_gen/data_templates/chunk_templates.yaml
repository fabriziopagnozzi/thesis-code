note_style_templates:
    admission_course:
        seen:
            - id: outer_admission_course_seen_1
              template: "{patient} was admitted{condition_intro} after {presentation}. {cohort_sentence} {axis_sentence}"
        heldout:
            - id: outer_admission_course_heldout_1
              template: "{patient} came in after {presentation}{condition_management_clause}. {cohort_sentence} {axis_sentence}"
    cohort_first:
        seen:
            - id: outer_cohort_first_seen_1
              template: "{cohort_sentence} {patient} presented after {presentation}{condition_management_clause}. {axis_sentence}"
        heldout:
            - id: outer_cohort_first_heldout_1
              template: "{cohort_sentence} During this hospitalization, {patient_lower} was admitted{condition_intro} after {presentation}. {axis_sentence}"
    embedded_course:
        seen:
            - id: outer_embedded_course_seen_1
              template: "{patient} presented after {presentation}{condition_management_clause}. {cohort_sentence} {axis_sentence}"
        heldout:
            - id: outer_embedded_course_heldout_1
              template: "After {presentation}, {patient_lower} was admitted{condition_intro}. {cohort_sentence} {axis_sentence}"

