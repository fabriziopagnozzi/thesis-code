simple_interpretations:
    treatment_duration:
        short: "This treatment duration evidence indicates a short active inpatient therapy interval."
        standard: "This treatment duration evidence indicates a standard inpatient therapy interval."
        prolonged: "This treatment duration evidence indicates a prolonged inpatient therapy interval."
    rehab_outcome:
        home_rehab: "This rehab outcome evidence indicates discharge with home or outpatient therapy support."
        inpatient_rehab: "This rehab outcome evidence indicates facility-based rehabilitation needs after discharge."
        persistent_deficit: "This rehab outcome evidence indicates persistent functional limitation at discharge."
    complication_burden:
        none_documented: "This complication burden evidence indicates no major inpatient complication."
        limited_complication: "This complication burden evidence indicates a limited or self-limited inpatient complication."
        major_complication: "This complication burden evidence indicates a major inpatient complication affecting management."
    acute_clinical_course:
        early_stabilization: "This acute clinical course evidence indicates early stabilization during the admission."
        delayed_improvement: "This acute clinical course evidence indicates delayed improvement during the admission."
        refractory_or_worsening: "This acute clinical course evidence indicates refractory or worsening illness despite initial management."
    care_intensity:
        ward_level: "This care intensity evidence indicates routine ward-level inpatient management."
        monitored_bed: "This care intensity evidence indicates step-down or telemetry-level monitoring."
        intensive_care: "This care intensity evidence indicates ICU-level management."
    diagnostic_evidence_type:
        bedside_laboratory_pattern: "This diagnostic evidence type indicates bedside findings and laboratory results as the main support."
        structural_visual_evidence: "This diagnostic evidence type indicates imaging or other visualized structural support."
        specimen_or_specialized_test: "This diagnostic evidence type indicates specimen-based or specialized diagnostic testing."

