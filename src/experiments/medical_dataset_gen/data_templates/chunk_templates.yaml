note_style_templates:
    brief_hospital_course:
        - "{patient} was admitted with {condition} after {presentation}. {cohort_sentence} {axis_sentence}"
        - "{patient} was hospitalized for {condition} after presenting with {presentation}. {cohort_sentence} {axis_sentence}"
    progress_note:
        - During admission for {condition}, {patient_lower} was treated after presenting with {presentation}. {cohort_sentence} {axis_sentence}
        - "{patient} presented with {presentation} and was treated for {condition}. {cohort_sentence} {axis_sentence}"
    discharge_summary:
        - "{patient} was treated for {condition} after {presentation}. {cohort_sentence} {axis_sentence}"
        - Following presentation with {presentation}, {patient_lower} was managed for {condition}. {cohort_sentence} {axis_sentence}
cohort_evidence_templates:
    sex:
        - "{pronoun_cap} was {subgroup_phrase}."
    comorbidity_present:
        - "{possessive_cap} history included {subgroup_phrase}."
        - Background history was notable for {subgroup_phrase}.
        - "{pronoun_cap} had {subgroup_phrase}."
    comorbidity_reference:
        - "{pronoun_cap} had {subgroup_phrase}."
axis_sentence_templates:
    treatment_duration:
        - "Treatment duration consisted of {axis_value}. This amounted to a {axis_bin_term}."
        - "The treatment duration was {axis_value}. Overall, this was a {axis_bin_term}."
        - "Treatment duration totaled {axis_value}. Overall, this was a {axis_bin_term}."
    rehab_outcome:
        - "The rehabilitation outcome was {axis_value}. This was most consistent with {axis_bin_term}."
        - "By discharge, the rehabilitation outcome was {axis_value}. Overall, this indicated {axis_bin_term}."
    complication_burden:
        - "The in-hospital complication burden included {axis_value}. Overall, this reflected {axis_bin_term}."
        - "Across the admission, the in-hospital complication burden involved {axis_value}. Overall, this reflected {axis_bin_term}."
        - "Complication burden review showed {axis_value}, indicating {axis_bin_term} for the admission."
    acute_clinical_course:
        - "The acute clinical course involved {axis_value}. Overall, this reflected {axis_bin_term}."
        - "Across the hospitalization, {axis_value} defined the acute clinical course. Overall, this reflected {axis_bin_term}."
        - "Early inpatient progression in the acute clinical course showed {axis_value}. Overall, this reflected {axis_bin_term}."
    care_intensity:
        - "Care intensity reached {axis_value}. Overall, this required {axis_bin_term}."
        - "The highest care intensity involved {axis_value}. Overall, this reflected {axis_bin_term}."
        - "Hospital care escalated and care intensity reached {axis_value}. Overall, this reflected {axis_bin_term}."
duration_phrase_templates:
    - "{duration_days} days of {treatment}"
    - "{duration_days} days of therapy with {treatment}"
    - "a {duration_days}-day course of {treatment}"
hidden_benchmark_terms:
    - admission adm_
    - benchmark
    - chunk
    - cohort descriptor
    - distractor
    - facet
    - gold
    - index terms
    - qrel
    - source query
    - structured cohort
    - synthetic
    - target query
