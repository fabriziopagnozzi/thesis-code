duration_chunk_templates:
  - "{patient} was admitted with {condition}, with {presentation}. {duration_sentence}, and {response_verb} {response} during the treatment course. {close}"
  - "{patient} presented with {condition}, including {presentation}. {duration_sentence}, while {response_verb} {response} after active therapy. {close}"
  - "{patient} required hospitalization for {condition} after developing {presentation}. {duration_sentence}, and {response_verb} {response} later in the treatment record. {close}"
  - "{patient} was treated inpatient for {condition}, with {presentation} on presentation. {duration_sentence}; {response_verb} {response} as the medication course ended. {close}"
  - "{patient} was hospitalized for {condition} in the setting of {presentation}. {duration_sentence}, and {response_verb} {response} at completion of therapy. {close}"

duration_course_nouns:
  - active treatment course
  - active therapy interval
  - inpatient treatment course
  - documented therapy course
  - hospital treatment interval
  - monitored inpatient regimen
  - recorded treatment plan
  - treatment-duration plan

# Mid-sentence duration clauses that must expose {treatment} and {duration_days}.
duration_phrase_templates:
  - "{treatment} was continued for {duration_days} days"
  - therapy-course length was {duration_days} days on {treatment}
  - total treatment duration was {duration_days} days with {treatment}
  - the active therapy interval lasted {duration_days} days on {treatment}
  - the {course_noun} included {treatment} for {duration_days} days
  - clinicians completed {duration_days} days of {treatment}
  - the team documented a {duration_days}-day treatment course of {treatment}
  - records showed {duration_days} days of treatment with {treatment}
  - "{treatment} remained in place across a {duration_days}-day course"

# Attribution phrases that introduce the status/response clause in duration chunks.
duration_response_verbs:
  - the treatment-duration note described
  - clinicians documented
  - the therapy-course review noted
  - the care team documented
  - the medication record reflected
  - the final inpatient treatment note described

# Per-condition closing sentences appended at the end of duration chunks.
duration_closing_sentences:
  encephalitis_myelitis:
    - Neurology follow-up was arranged to monitor recovery after completion of the anti-inflammatory or antiviral course.
    - The discharge medication list matched the completed neurologic treatment plan and outpatient neurology follow-up.
    - Repeat examination was stable, and the team documented no escalation beyond the completed inpatient course.
  pneumonia:
    - The discharge medication list matched the completed antimicrobial plan and outpatient pulmonary follow-up.
    - Respiratory status was stable, and no additional inpatient antibiotic escalation was documented.
    - The plan emphasized completion of antimicrobial management and reassessment by the primary clinician.
  ischemic_stroke:
    - The discharge medication list emphasized vascular prevention and outpatient neurology follow-up.
    - Repeat examination was stable, and the team documented no extension of the acute infarct.
    - The plan focused on secondary stroke prevention and close neurologic reassessment.
  heart_failure:
    - The discharge medication list reflected the completed decongestive plan and cardiology follow-up.
    - Volume status was stable, and the team documented no further inpatient escalation.
    - The plan emphasized weight monitoring, medication adjustment, and early outpatient reassessment.
  bacterial_meningitis:
    - The discharge medication plan matched the completed meningitis treatment course and neurologic monitoring plan.
    - The team documented stable examination findings after directed antimicrobial therapy.
    - Follow-up emphasized monitoring for recurrent fever, headache, or cognitive change.
  multiple_sclerosis_relapse:
    - The discharge plan emphasized neurology follow-up after completion of relapse-directed therapy.
    - The team documented no additional acute demyelinating symptoms before discharge.
    - Medication reconciliation matched the completed relapse treatment and outpatient disease-management plan.
  spinal_epidural_abscess:
    - The plan emphasized completion of antimicrobial therapy and close spine or infectious-disease follow-up.
    - Neurologic checks were stable, and no further inpatient escalation was documented.
    - The discharge medication plan matched the infection-control strategy and mobility precautions.
  pulmonary_embolism:
    - The discharge medication list matched the anticoagulation plan and pulmonary follow-up.
    - Hemodynamics were stable, and the team documented no further inpatient escalation.
    - The plan emphasized anticoagulation adherence, bleeding precautions, and reassessment of oxygen needs.
  copd_exacerbation:
    - The discharge medication list reflected the completed respiratory exacerbation plan and inhaler teaching.
    - Breathing was stable, and no additional inpatient ventilatory escalation was documented.
    - The plan emphasized pulmonary follow-up, trigger avoidance, and reassessment of oxygen needs.
  infective_endocarditis:
    - The plan emphasized completion of intravenous antibiotics and infectious-disease follow-up.
    - The team documented clinical stability during transition to the prolonged antibiotic plan.
    - Follow-up focused on culture clearance, valve assessment, and antibiotic monitoring.
  osteomyelitis:
    - The plan emphasized antimicrobial completion, wound monitoring, and mobility precautions.
    - The discharge plan matched the bone-infection treatment strategy and follow-up imaging or laboratory monitoring.
    - The team documented stable local examination findings before transition out of the hospital.
  pyelonephritis_sepsis:
    - The discharge medication list matched the completed urinary-infection treatment plan and renal follow-up.
    - Hemodynamics were stable, and the team documented no further sepsis-related escalation.
    - The plan emphasized infection follow-up and monitoring for recurrent fever or urinary symptoms.
  diabetic_foot_infection:
    - The plan emphasized antibiotic completion, wound care, glycemic management, and offloading.
    - The discharge plan matched the foot-infection treatment strategy and close podiatry follow-up.
    - The team documented stable wound findings before transition to outpatient or facility-based care.
  cirrhosis_encephalopathy:
    - The medication plan matched the hepatic encephalopathy regimen and liver follow-up.
    - Mentation was stable, and the team documented no further inpatient escalation.
    - The plan emphasized adherence to bowel-regimen therapy and monitoring for recurrent confusion.
  lupus_nephritis:
    - The plan emphasized nephrology and rheumatology follow-up after flare-directed therapy.
    - Renal status was stable, and the team documented no further inpatient escalation.
    - The discharge medication plan matched the immunosuppressive treatment strategy and laboratory monitoring.
  severe_cellulitis:
    - The discharge medication list matched the completed soft-tissue infection plan and wound reassessment.
    - The limb examination was stable, and the team documented no further inpatient escalation.
    - The plan emphasized skin monitoring, limb elevation, and reassessment for recurrent infection.
  ulcerative_colitis_flare:
    - The plan emphasized gastroenterology follow-up after flare-directed therapy.
    - Oral intake was stable, and the team documented no further inpatient escalation.
    - The discharge medication plan matched the colitis treatment strategy and monitoring for recurrent bleeding.
