# Surface forms used when render_rehab_chunk() turns a rehab-outcome fact into text.

# Full outer sentence frames; one is chosen per rendered rehab chunk.
rehab_chunk_templates:
  - "{patient} was managed for {condition}, with {presentation}. {transition}, {functional_detail}; {rehab_outcome_verb} {rehab_outcome}. {close}"
  - "{patient} received inpatient care for {condition} after {presentation}. {transition}, {functional_detail}, and {rehab_outcome_verb} {rehab_outcome}. {close}"
  - Hospitalization for {condition} included {presentation} in {patient_lower}. {transition}, the functional exam showed {functional_detail}; {rehab_outcome_verb} {rehab_outcome}. {close}
  - "{patient} was treated for {condition}, with the early course notable for {presentation}. {transition}, functional recovery was described as {functional_detail}. {rehab_outcome_verb} {rehab_outcome}. {close}"
  - "{patient} remained hospitalized for {condition} with {presentation}. {transition}, functional planning reflected that {functional_detail}; {rehab_outcome_verb} {rehab_outcome}. {close}"

# Per-condition, per-bin functional detail phrases inserted before the exact rehab outcome string.
functional_status_phrases:
  encephalitis_myelitis:
    home_rehab:
      - orientation improved and gait was safe with supervised exercises
      - headache resolved and mild balance deficits could be managed with supervision
      - mental status returned near baseline with residual fatigue
    inpatient_rehab:
      - orientation improved but gait instability still made independent mobility unsafe
      - weakness persisted despite improved fever and stable neurologic checks
      - cognitive slowing and balance deficits still limited safe transfers
    persistent_deficit:
      - focal weakness and impaired balance remained prominent
      - confusion improved only partially and mobility stayed limited
      - residual neurologic deficits were still documented on the final examination
  pneumonia:
    home_rehab:
      - oxygen needs improved and endurance was adequate for supervised activity
      - cough and fever improved, but conditioning remained below baseline
      - breathing was stable on room air with mild residual weakness
    inpatient_rehab:
      - respiratory status improved but deconditioning limited transfers
      - oxygenation stabilized while weakness still prevented independent ambulation
      - fatigue after respiratory illness made self-care unsafe
    persistent_deficit:
      - exertional dyspnea persisted despite improvement in fever
      - oxygen requirement remained a barrier to baseline activity
      - exercise tolerance stayed reduced at the end of the stay
  ischemic_stroke:
    home_rehab:
      - speech improved and gait was safe with outpatient support
      - mild dysarthria persisted but transfers were independent
      - strength improved enough for home discharge planning
    inpatient_rehab:
      - hemiparesis still limited transfers and gait safety
      - aphasia improved but mobility deficits required supervised practice
      - motor deficits remained too significant for independent self-care
    persistent_deficit:
      - hemiparesis remained prominent on the final neurologic examination
      - aphasia and mobility impairment persisted
      - residual focal deficits continued to limit safe ambulation
  heart_failure:
    home_rehab:
      - dyspnea improved and walking tolerance was adequate for a supervised home plan
      - edema decreased and activity tolerance was improving
      - volume status stabilized with residual fatigue
    inpatient_rehab:
      - deconditioning remained marked despite improved volume status
      - fatigue and poor endurance still limited transfers
      - breathing improved, but mobility remained unsafe without supervised strengthening
    persistent_deficit:
      - exertional dyspnea continued to limit hallway ambulation
      - fatigue and mobility limitation remained near discharge
      - residual congestion symptoms kept exercise tolerance reduced
  bacterial_meningitis:
    home_rehab:
      - headache improved and orientation was adequate for supervised home activity
      - balance was mildly impaired but safe with outpatient therapy support
      - cognition improved enough for a home recovery plan
    inpatient_rehab:
      - cognitive slowing and balance deficits still limited safe transfers
      - weakness and slowed processing required daily therapy intensity
      - gait instability remained unsafe without supervised rehabilitation
    persistent_deficit:
      - cognitive slowing and gait instability remained evident
      - residual weakness and impaired balance continued to limit mobility
      - ongoing neurologic deficits were still documented on final examination
  multiple_sclerosis_relapse:
    home_rehab:
      - gait improved enough for home therapy with assistive-device teaching
      - fatigue persisted but transfers were safe with outpatient support
      - weakness improved and the patient could continue recovery outside the hospital
    inpatient_rehab:
      - leg weakness still limited transfers and safe ambulation
      - fatigue and imbalance made independent mobility unsafe
      - persistent mobility deficits required supervised therapy before return home
    persistent_deficit:
      - lower-extremity weakness and imbalance remained prominent
      - sensory symptoms and gait deficits continued to limit safe ambulation
      - neurologic deficits remained functionally important at discharge
  spinal_epidural_abscess:
    home_rehab:
      - pain control improved and leg strength was adequate for protected home ambulation
      - mobility improved after treatment and outpatient therapy was feasible
      - transfers were safe with precautions and home physical therapy planning
    inpatient_rehab:
      - leg weakness and pain still limited transfers after decompression planning
      - gait remained unsafe despite improved infection control
      - mobility deficits required supervised strengthening before return home
    persistent_deficit:
      - lower-extremity weakness and sensory loss remained functionally limiting
      - residual neurologic deficits continued to impair independent mobility
      - pain and gait impairment stayed prominent near discharge
  pulmonary_embolism:
    home_rehab:
      - dyspnea improved and activity could advance gradually at home
      - oxygenation stabilized with mild residual exertional limitation
      - walking tolerance improved enough for outpatient therapy support
    inpatient_rehab:
      - hypoxemia improved but deconditioning still limited safe ambulation
      - severe fatigue after pulmonary embolism prevented independent transfers
      - mobility remained limited despite stable anticoagulation planning
    persistent_deficit:
      - exertional dyspnea continued to limit hallway walking
      - oxygen requirement and reduced walking tolerance remained near discharge
      - endurance stayed below baseline despite hemodynamic stability
  copd_exacerbation:
    home_rehab:
      - breathing improved and inhaler teaching supported a home plan
      - endurance was reduced but safe for supervised pulmonary rehabilitation
      - work of breathing improved enough for home therapy planning
    inpatient_rehab:
      - deconditioning and dyspnea still limited safe ambulation
      - weakness after respiratory failure prevented independent transfers
      - poor endurance required supervised rehabilitation before return home
    persistent_deficit:
      - dyspnea and exertional limitation remained prominent
      - ongoing oxygen need reduced baseline activity tolerance
      - poor endurance continued to limit safe ambulation
  infective_endocarditis:
    home_rehab:
      - strength improved enough for home infusion support and outpatient therapy
      - endurance was improving while antibiotic completion continued outside the hospital
      - mobility was safe with home rehabilitation and line-care planning
    inpatient_rehab:
      - marked deconditioning during prolonged antibiotic therapy limited transfers
      - endurance and mobility remained unsafe for independent home care
      - weakness after prolonged infection required supervised rehabilitation
    persistent_deficit:
      - fatigue and reduced mobility remained functionally important
      - ongoing endurance limitation complicated antibiotic completion
      - persistent weakness continued to limit daily activity
  osteomyelitis:
    home_rehab:
      - pain and swelling improved enough for protected weight bearing at home
      - mobility was safe with offloading instructions and outpatient therapy
      - transfers improved while wound and antibiotic follow-up continued
    inpatient_rehab:
      - weight-bearing restrictions and weakness still limited independent gait
      - transfers required supervised practice because offloading needs remained complex
      - pain and mobility limits made home return unsafe without rehabilitation
    persistent_deficit:
      - pain and impaired mobility remained prominent
      - difficulty with ambulation continued despite infection-control planning
      - weight-bearing limits and weakness still reduced independence
  pyelonephritis_sepsis:
    home_rehab:
      - strength improved after sepsis treatment and visiting nursing was feasible
      - fatigue was improving with safe home activity advancement
      - mobility returned close enough to baseline for home physical therapy
    inpatient_rehab:
      - deconditioning after septic illness still limited transfers
      - weakness and poor endurance kept mobility below baseline
      - safe ambulation required supervised rehabilitation after infection control
    persistent_deficit:
      - weakness and limited endurance remained at discharge
      - ongoing fatigue after sepsis reduced safe activity tolerance
      - mobility stayed below baseline despite resolution of acute infection
  diabetic_foot_infection:
    home_rehab:
      - pain improved and protected ambulation was feasible with wound-care support
      - offloading precautions were manageable with outpatient gait therapy
      - mobility improved enough for home therapy and close wound follow-up
    inpatient_rehab:
      - offloading precautions and weakness still limited safe transfers
      - mobility remained unsafe because wound-care restrictions were complex
      - gait training required supervised rehabilitation before return home
    persistent_deficit:
      - gait limitation and wound-related pain remained prominent
      - ongoing mobility difficulty required close podiatry and therapy follow-up
      - offloading needs continued to reduce independent ambulation
  cirrhosis_encephalopathy:
    home_rehab:
      - mentation improved and balance was adequate for supervised home therapy
      - orientation returned near baseline with mild residual fatigue
      - safe activity advancement was feasible with visiting nursing support
    inpatient_rehab:
      - weakness and cognitive slowing still limited safe mobility
      - falls risk and deconditioning required supervised rehabilitation
      - orientation improved but transfers remained unsafe without daily therapy
    persistent_deficit:
      - cognitive slowing and poor balance remained at discharge
      - fatigue and impaired mobility continued to limit independence
      - residual encephalopathy symptoms still affected safe activity
  lupus_nephritis:
    home_rehab:
      - edema improved and weakness was manageable with outpatient therapy
      - renal function stabilized enough for home physical therapy planning
      - activity tolerance improved while nephrology follow-up remained close
    inpatient_rehab:
      - deconditioning after immunosuppressive therapy still limited transfers
      - weakness and edema made independent mobility unsafe
      - poor endurance required supervised rehabilitation before return home
    persistent_deficit:
      - fatigue and reduced mobility remained prominent
      - ongoing weakness continued to limit safe activity
      - edema and poor endurance still reduced functional independence
  severe_cellulitis:
    home_rehab:
      - pain and swelling improved enough for safer ambulation at home
      - limb symptoms were improving with visiting nursing and home therapy planning
      - walking tolerance improved after antibiotics and limb elevation
    inpatient_rehab:
      - pain and weakness still limited transfers
      - mobility remained unsafe after prolonged soft-tissue infection
      - swelling and deconditioning required supervised rehabilitation
    persistent_deficit:
      - pain and limited walking tolerance remained at discharge
      - swelling and weakness continued to impair mobility
      - residual limb discomfort still reduced safe ambulation
  ulcerative_colitis_flare:
    home_rehab:
      - strength improved after flare control and outpatient therapy was feasible
      - abdominal pain improved enough for home physical therapy planning
      - oral intake and endurance improved with residual fatigue
    inpatient_rehab:
      - marked deconditioning after prolonged illness still limited self-care
      - weakness and poor endurance made independent home activity unsafe
      - fatigue after severe colitis required supervised rehabilitation
    persistent_deficit:
      - fatigue and poor endurance remained at discharge
      - ongoing weakness continued to limit return to baseline activity
      - reduced activity tolerance persisted despite improved bowel symptoms

# Closing lines appended at the end of rehab chunks; persistent_deficit stays condition-specific.
rehab_closing_sentences:
  home_rehab:
    - The plan emphasized caregiver teaching, home safety, and close outpatient reassessment.
    - The patient left with clear activity precautions and follow-up for functional recovery.
    - The team documented a stable medical condition with continued recovery outside the hospital.
  inpatient_rehab:
    - The plan emphasized supervised strengthening, mobility training, and reassessment before return home.
    - The team documented a need for daily therapy intensity after medical stabilization.
    - Transfer planning focused on fall prevention, endurance, and recovery of daily activities.
  persistent_deficit:
    encephalitis_myelitis:
      - Neurology follow-up was arranged because recovery remained incomplete.
      - The plan emphasized monitoring residual neurologic deficits after discharge.
    pneumonia:
      - Pulmonary follow-up was arranged because respiratory recovery remained incomplete.
      - The plan emphasized monitoring oxygen needs and gradual return of endurance.
    ischemic_stroke:
      - Neurology follow-up was arranged because focal deficits remained functionally important.
      - The plan emphasized continued monitoring of neurologic recovery after discharge.
    heart_failure:
      - Cardiology follow-up was arranged because functional recovery remained limited.
      - The plan emphasized symptom monitoring and gradual activity advancement.
    bacterial_meningitis:
      - Neurology and infectious-disease follow-up were arranged because recovery remained incomplete.
      - The plan emphasized monitoring residual cognitive, gait, and hearing-related concerns.
    multiple_sclerosis_relapse:
      - Neurology follow-up was arranged because relapse recovery remained incomplete.
      - The plan emphasized monitoring residual weakness, gait difficulty, and fatigue.
    spinal_epidural_abscess:
      - Spine and infectious-disease follow-up were arranged because neurologic recovery remained incomplete.
      - The plan emphasized monitoring residual weakness, sensory loss, and recurrent infection symptoms.
    pulmonary_embolism:
      - Pulmonary follow-up was arranged because exertional recovery remained incomplete.
      - The plan emphasized monitoring oxygen needs, dyspnea, and anticoagulation tolerance.
    copd_exacerbation:
      - Pulmonary follow-up was arranged because respiratory recovery remained incomplete.
      - The plan emphasized inhaler adherence, oxygen monitoring, and gradual activity advancement.
    infective_endocarditis:
      - Infectious-disease follow-up was arranged because functional recovery remained limited during antibiotic completion.
      - The plan emphasized monitoring fatigue, mobility, and complications of prolonged infection.
    osteomyelitis:
      - Infectious-disease and wound follow-up were arranged because mobility recovery remained incomplete.
      - The plan emphasized monitoring pain, ambulation limits, and infection-control markers.
    pyelonephritis_sepsis:
      - Primary-care follow-up was arranged because recovery from sepsis-related weakness remained incomplete.
      - The plan emphasized monitoring fatigue, endurance, and recurrent urinary symptoms.
    diabetic_foot_infection:
      - Podiatry and wound follow-up were arranged because gait recovery remained incomplete.
      - The plan emphasized monitoring offloading adherence, wound pain, and mobility limits.
    cirrhosis_encephalopathy:
      - Hepatology follow-up was arranged because cognitive and mobility recovery remained incomplete.
      - The plan emphasized monitoring mentation, falls risk, and adherence to encephalopathy therapy.
    lupus_nephritis:
      - Nephrology and rheumatology follow-up were arranged because functional recovery remained incomplete.
      - The plan emphasized monitoring fatigue, edema, renal function, and immunosuppressive therapy.
    severe_cellulitis:
      - Wound and primary-care follow-up were arranged because limb function remained limited.
      - The plan emphasized monitoring swelling, pain, and recurrent soft-tissue infection.
    ulcerative_colitis_flare:
      - Gastroenterology follow-up was arranged because endurance recovery remained incomplete.
      - The plan emphasized monitoring nutrition, recurrent bleeding, and gradual activity advancement.
# Transition phrases that introduce the discharge/therapy-status part of rehab chunks.
rehab_transitions:
  - By discharge
  - At discharge
  - Near the end of the hospitalization
  - In the final therapy assessment
  - On the day of discharge
  - Before leaving the hospital
# Attribution phrases that introduce the explicit rehab outcome clause.
rehab_outcome_verbs:
  - the discharge record described
  - therapy documentation noted
  - the functional assessment documented
  - the discharge summary described
  - the care team documented
  - the therapy plan noted
