condition_presentations:
  encephalitis_myelitis:
    - fever, confusion, and gait change
    - headache, altered mental status, and lower-extremity weakness
    - new neurologic deficits and inflammatory cerebrospinal fluid findings
  pneumonia:
    - hypoxemia, fever, and productive cough
    - new oxygen requirement and bibasilar infiltrates
    - dyspnea, leukocytosis, and radiographic consolidation
  ischemic_stroke:
    - acute dysarthria and unilateral weakness
    - new focal neurologic deficits on arrival
    - hemiparesis with imaging consistent with acute infarct
  heart_failure:
    - volume overload, edema, and exertional dyspnea
    - pulmonary congestion and elevated filling pressures
    - worsening orthopnea with lower-extremity edema
  bacterial_meningitis:
    - fever, headache, neck stiffness, and photophobia
    - meningeal signs with confusion and inflammatory cerebrospinal fluid findings
    - sepsis physiology with meningismus and altered mental status
  multiple_sclerosis_relapse:
    - new weakness, sensory change, and gait instability
    - demyelinating flare with leg weakness and urinary urgency
    - worsening neurologic symptoms without evidence of acute infection
  spinal_epidural_abscess:
    - severe back pain, fever, and evolving leg weakness
    - epidural infection with canal narrowing and concern for cord compression
    - back pain with neurologic symptoms and elevated inflammatory markers
  pulmonary_embolism:
    - acute dyspnea, pleuritic chest pain, and hypoxemia
    - tachycardia with pulmonary emboli and concern for right heart strain
    - new oxygen requirement after imaging confirmed pulmonary embolism
  copd_exacerbation:
    - wheezing, increased sputum, and worsening dyspnea
    - hypercapnia with increased work of breathing
    - acute bronchospasm and hypoxemia above baseline oxygen needs
  infective_endocarditis:
    - persistent bacteremia, fever, and concern for valvular infection
    - new murmur with bloodstream infection and embolic risk
    - positive blood cultures with echocardiographic concern for endocarditis
  osteomyelitis:
    - focal bone pain, inflammatory markers, and imaging concerning for infection
    - chronic wound changes with contiguous bone infection
    - localized swelling and tenderness with suspected osteomyelitis
  pyelonephritis_sepsis:
    - fever, flank pain, hypotension, and urinary infection
    - urosepsis with leukocytosis and acute kidney stress
    - pyelonephritis complicated by bacteremia and systemic inflammatory response
  diabetic_foot_infection:
    - plantar ulceration, cellulitis, and concern for deep soft-tissue infection
    - infected diabetic foot wound with drainage and offloading needs
    - progressive foot erythema, pain, and wound-care complexity
  cirrhosis_encephalopathy:
    - confusion, asterixis, and decompensated cirrhosis
    - hepatic encephalopathy with sleep-wake reversal and poor orientation
    - worsening mentation in the setting of chronic liver disease
  lupus_nephritis:
    - proteinuria, edema, and immune-mediated kidney injury
    - active lupus serologies with worsening renal function
    - nephritic urine findings and volume overload during lupus flare
  severe_cellulitis:
    - limb erythema, swelling, pain, and systemic inflammatory signs
    - rapidly progressive soft-tissue infection without drainable abscess
    - cellulitis with fever, leukocytosis, and impaired ambulation
  ulcerative_colitis_flare:
    - bloody diarrhea, abdominal pain, and elevated inflammatory markers
    - severe colitis symptoms with dehydration and poor oral intake
    - frequent stools, cramping, and worsening inflammatory bowel disease activity

condition_status_phrases:
  encephalitis_myelitis:
    - improving mentation and reduced headache
    - improved strength and stable neurologic checks
    - resolution of fever and stable neurologic examination
  pneumonia:
    - improved oxygenation and reduced cough
    - stable oxygen saturation on room air
    - improving dyspnea and downtrending fever
  ischemic_stroke:
    - stable neurologic examination
    - improved speech clarity
    - no new neurologic deficits
  heart_failure:
    - improved volume status
    - decreased edema and easier breathing
    - stable renal function after diuresis
  bacterial_meningitis:
    - defervescence with improving headache and mentation
    - stable neurologic checks after antimicrobial therapy
    - improved neck stiffness and clearer cognition
  multiple_sclerosis_relapse:
    - partial strength recovery after relapse treatment
    - improved sensation with persistent gait fatigue
    - stable neurologic examination without new deficits
  spinal_epidural_abscess:
    - improved pain control and stable neurologic checks
    - downtrending inflammatory markers after source control planning
    - stable leg strength after antimicrobial and procedural management
  pulmonary_embolism:
    - improved oxygenation after anticoagulation
    - reduced dyspnea with stable hemodynamics
    - stable heart rate and improving exertional symptoms
  copd_exacerbation:
    - improved air movement and reduced wheezing
    - stable gas exchange after bronchodilator and steroid therapy
    - decreased work of breathing near discharge
  infective_endocarditis:
    - blood cultures cleared after directed antibiotic therapy
    - fever resolved with stable valvular assessment
    - clinical stability during prolonged intravenous antibiotic planning
  osteomyelitis:
    - improved local pain after antimicrobial therapy
    - stable wound appearance with inflammatory markers trending down
    - infection control improved while mobility restrictions remained
  pyelonephritis_sepsis:
    - resolved shock physiology and improving leukocytosis
    - defervescence with improved flank pain
    - stable renal function after treatment of urinary infection
  diabetic_foot_infection:
    - improved erythema after antibiotics and wound care
    - stable wound bed with reduced drainage
    - infection control improved while offloading remained necessary
  cirrhosis_encephalopathy:
    - clearer mentation after bowel regimen adjustment
    - improved orientation with ongoing liver-disease monitoring
    - reduced asterixis and stable volume status
  lupus_nephritis:
    - stabilized renal function after immunosuppressive treatment
    - improved edema with ongoing nephrology monitoring
    - proteinuria evaluation stabilized during flare management
  severe_cellulitis:
    - reduced erythema and improved pain control
    - defervescence with stable soft-tissue examination
    - decreased swelling after antibiotics and limb elevation
  ulcerative_colitis_flare:
    - reduced stool frequency and improved abdominal pain
    - improved hydration and inflammatory symptoms
    - stable hemoglobin with better oral intake

duration_closing_sentences:
