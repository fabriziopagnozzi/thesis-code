  osteomyelitis:
    - The plan emphasized antimicrobial completion, wound monitoring, and mobility precautions.
    - The discharge plan matched the bone-infection treatment strategy and follow-up imaging or laboratory monitoring.
    - The team documented stable local examination findings before transition out of the hospital.
  pyelonephritis_sepsis:
    - The discharge medication list matched the completed urinary-infection treatment plan and renal follow-up.
    - Hemodynamics were stable, and the team documented no further sepsis-related escalation.
    - The plan emphasized infection follow-up and monitoring for recurrent fever or urinary symptoms.
  diabetic_foot_infection:
    - The plan emphasized antibiotic completion, wound care, glycemic management, and offloading.
    - The discharge plan matched the foot-infection treatment strategy and close podiatry follow-up.
    - The team documented stable wound findings before transition to outpatient or facility-based care.
  cirrhosis_encephalopathy:
    - The medication plan matched the hepatic encephalopathy regimen and liver follow-up.
    - Mentation was stable, and the team documented no further inpatient escalation.
    - The plan emphasized adherence to bowel-regimen therapy and monitoring for recurrent confusion.
  lupus_nephritis:
    - The plan emphasized nephrology and rheumatology follow-up after flare-directed therapy.
    - Renal status was stable, and the team documented no further inpatient escalation.
    - The discharge medication plan matched the immunosuppressive treatment strategy and laboratory monitoring.
  severe_cellulitis:
    - The discharge medication list matched the completed soft-tissue infection plan and wound reassessment.
    - The limb examination was stable, and the team documented no further inpatient escalation.
    - The plan emphasized skin monitoring, limb elevation, and reassessment for recurrent infection.
  ulcerative_colitis_flare:
