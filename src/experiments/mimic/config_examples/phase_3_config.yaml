build_query_prompts:
  n_grounding_patients: 6
  max_modifiers: 3

  high_value_sections:
    - BRIEF HOSPITAL COURSE
    - HISTORY OF PRESENT ILLNESS
    - DISCHARGE DIAGNOSIS
    - DISCHARGE MEDICATIONS

  demographic_modifiers:
    - text: "the patient is elderly (age > 75)"
      column: age
      op: ">"
      value: 75
    - text: "the patient is a young adult (age < 40)"
      column: age
      op: "<"
      value: 40

  prompt_template: |
    Below are excerpts from real discharge summaries of patients admitted for {condition} where {modifier} was also present.

    <START DISCHARGE SUMMARIES EXAMPLES>
    {chunks_block}
    <END DISCHARGE SUMMARIES EXAMPLES>

    Using these real cases as background, generate ONE question about {condition} where {modifier} is present.
    The question MUST ask about a specific clinical decision or treatment pattern that connects
    at least two different aspects of care. For example, a drug adjustment AND the lab finding
    that triggered it, or a procedure AND the complication that followed it.

    Good examples:
    - "How is insulin dosing adjusted in T2DM patients with declining renal function, and what electrolyte abnormalities are monitored alongside these changes?"
    - "What anticoagulation strategies are used at discharge for heart failure patients with atrial fibrillation, and how does renal function influence the choice?"
    - "What fluid management strategies are documented for COPD exacerbation patients with concurrent heart failure, and what clinical signs trigger a change in approach?"

    Bad examples (too broad - just listing):
    - "What medications are prescribed for T2DM patients with CHF?"
    - "What complications are seen in heart failure patients?"
    - "What labs are monitored for patients with renal disease?"

    Requirements:
    - Must connect two or more clinical aspects (treatment + reasoning, drug + monitoring, procedure + outcome)
    - Can be answered by reading across many discharge notes (not from a textbook)
    - Requires evidence from multiple patients - no single note fully answers it
    - Should ask about observable patterns in the data, not about what "should" be done

    Keep the question to 1-2 sentences. Return ONLY the question, nothing else.

gen_queries_llm:
  save_every: 25
  model: gemma4:31b
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  think: false

filter_queries:
  k_values: [ 5, 10, 20, 30 ]
  lam_values: [ 0.3, 0.5, 0.7, 0.8 ]
  jaccard_threshold: 0.85

gold_annotation:
  batch_size: 20
  num_ctx: 8_000
  num_predict: 2000
  model: gemma4:31b
  temperature: 0.35
  top_p: 0.95
  top_k: 40
  think: false
  stream: false
  aspect_discovery_system_prompt: >-
    You are a clinical information analyst. Given a clinical question, identify
    the distinct aspects of care it asks about. Each aspect is one facet of the
    answer - a specific clinical dimension that must be covered to fully answer
    the question.
  aspect_discovery_user_template: |
    QUESTION: {query_text}

    The question asks about a clinical pattern that connects several aspects of care.
    List 2-6 aspects that a complete answer must cover.

    For each aspect produce:
    - facet_label: short snake_case identifier (e.g., "insulin_adjustment", "renal_monitoring")
    - description: one sentence defining what evidence would count as substantive for this aspect

    Return JSON: {{"aspects": [{{"facet_label": "...", "description": "..."}}, ...]}}
    Return ONLY the JSON, nothing else.
  tagging_system_prompt: >-
    You are a clinical information analyst. You will be given a clinical
    question, one specific aspect of that question, and a batch of discharge
    note excerpts. Decide whether each chunk contains substantive evidence for
    the specified aspect only.
  tagging_user_template: |
    QUESTION: {query_text}
    ASPECT: {facet_label} - {facet_description}

    For each chunk below, decide whether it contains SUBSTANTIVE evidence for THIS aspect only.
    Substantive = specific drugs with doses, specific labs with clinical interpretation,
    specific procedures with rationale, or explicit reasoning linking this aspect to the question.
    Mere mentions of a condition or drug without context are NOT substantive.

    <CHUNKS>
    {chunks_block}
    </CHUNKS>

    Return JSON: {{"decisions": [{{"chunk_id": "<id>", "relevant": true, "why": "<up to 15 words>"}}, ...]}}
    Include exactly one decision per chunk shown above. If none are relevant, return relevant=false for all.
    Return ONLY the JSON, nothing else.
