build_query_prompts:
  n_grounding_patients: 4
  max_modifiers: 3

  high_value_sections:
    - BRIEF HOSPITAL COURSE
    - HISTORY OF PRESENT ILLNESS
    - PERTINENT RESULTS
    - DISCHARGE DIAGNOSIS
    - DISCHARGE MEDICATIONS

  charlson_labels:
    myocardial_infarct: prior myocardial infarction
    congestive_heart_failure: congestive heart failure
    peripheral_vascular_disease: peripheral vascular disease
    cerebrovascular_disease: cerebrovascular disease
    dementia: dementia
    chronic_pulmonary_disease: chronic pulmonary disease (COPD)
    rheumatic_disease: rheumatic disease
    peptic_ulcer_disease: peptic ulcer disease
    mild_liver_disease: mild liver disease
    diabetes_without_cc: diabetes without complications
    diabetes_with_cc: diabetes with chronic complications
    paraplegia: hemiplegia or paraplegia
    renal_disease: chronic kidney disease
    malignant_cancer: malignancy
    severe_liver_disease: severe liver disease (cirrhosis)
    metastatic_solid_tumor: metastatic cancer
    aids: HIV/AIDS

  demographic_modifiers:
    - text: "the patient is elderly (age > 75)"
      column: age
      op: ">"
      value: 75
    - text: "the patient is a young adult (age < 40)"
      column: age
      op: "<"
      value: 40

  prompt_template: |
    Below are excerpts from real discharge summaries of patients admitted for {condition} where {modifier} was also present. Each excerpt is from the discharge notes, describing clinical management decisions, lab results, diagnoses, and medications.

    <START DISCHARGE SUMMARIES EXAMPLES>
    {chunks_block}
    <END DISCHARGE SUMMARIES EXAMPLES>

    Using these real cases as background context (but NOT overfitting to any specific patient in the examples), generate ONE clinical management question about {condition} that:
    - Requires knowing how treatment, workup, or monitoring changes when {modifier} is present
    - Is answerable by synthesizing patterns across multiple patient cases
    - Focuses on a generalizable management decision (drug choice, dosing adjustments, contraindications, monitoring frequency, disposition)
    - Requires multi-source evidence - no single patient note answers it fully

    Make sure to use the given discharge summaries examples only as a reference of what the dataset looks like: you don't have to generate a question about those specific examples: it must be a generalizable question.

    Return ONLY the question, nothing else.

gen_queries_llm:
  save_every: 25
  model: gemma4:31b
  temperature: 0.3
  top_p: 0.95
  top_k: 64
  think: false

filter_queries:
  k: 10
  lam: 0.35
  jaccard_threshold: 0.8
  prefilter_n: 300

gold_annotation:
  prefilter_n: 300
  batch_size: 30
  num_ctx: 32768
  num_predict: 16384
  model: gemma4:26b
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  think: false
  map_system_prompt: >-
    You are a clinical information analyst extracting structured evidence from discharge notes.
    Your task: for a given clinical question, identify which chunks contain relevant information
    and group them under a small set of high-level clinical facets.
    A facet is a CLINICAL DECISION CATEGORY (e.g. drug_choice, dose_adjustment, monitoring,
    contraindication, complication_management) — not a specific drug name, lab value, or patient
    scenario. Use the fewest facets that completely cover the answer. Be exhaustive in tagging
    chunks: every chunk relevant to a facet must be listed, not just the best one. Do NOT tag chunks 
    that are irrelevant to answering the question.
  map_user_template: |
    Question: {query_text}

    Below are excerpts from clinical discharge notes. Each is prefixed with its chunk ID, section, and patient context.

    <START DISCHARGE NOTES BLOCK>
    {chunks_block}
    <END DISCHARGE NOTES BLOCK>

    Identify the clinical aspects (facets) needed to fully answer the question. For each facet:
    1. Assign a short snake_case label describing the DECISION CATEGORY, not a specific drug or value.
       Good labels: "drug_choice", "dose_adjustment", "monitoring_frequency", "contraindication", "complication_management", "discharge_planning"
       Bad labels: "insulin_dose_reduction_for_ckd", "metformin_contraindication", "creatinine_monitoring"
    2. State one representative fact for this facet (one sentence)
    3. List ALL chunk_ids in this batch that provide evidence for this facet

    Rules:
    - Use at most 6 facet labels across your entire response
    - Merge facts that address the same decision category under one label
    - Only cite chunk_ids that appear in this batch
    - Check the patient metadata line (age, gender, comorbidities) on each chunk.
      Only tag a chunk if the patient profile matches what the question asks about.

    Return a JSON array. Example:
    [{{"facet_label": "dose_adjustment", "fact": "Insulin dose reduced by 20-30% when CrCl < 30 to avoid hypoglycemia", "chunk_ids": ["chunk_42", "chunk_87"]}}]

    If no chunks in this batch are relevant, return: []. Stick strictly to these instructions.
