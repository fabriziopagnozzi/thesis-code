build_query_prompts:
  n_grounding_patients: 6
  max_modifiers: 3

  high_value_sections:
    - BRIEF HOSPITAL COURSE
    - HISTORY OF PRESENT ILLNESS
    - DISCHARGE DIAGNOSIS
    - DISCHARGE MEDICATIONS

  demographic_modifiers:
    - text: "the patient is elderly (age > 75)"
      column: age
      op: ">"
      value: 75
    - text: "the patient is a young adult (age < 40)"
      column: age
      op: "<"
      value: 40

  prompt_template: |
    Below are excerpts from real discharge summaries of patients admitted for {condition}.

    <START DISCHARGE SUMMARIES EXAMPLES>
    {chunks_block}
    <END DISCHARGE SUMMARIES EXAMPLES>

    Using these real cases as background, generate ONE question about patients with {condition}
    that asks for clinical patterns across multiple aspects of care.
    The question must be generic enough that answering it requires reading across several patients;
    it must explicitly touch at least three of these aspects:

    {modifier_list}

    Good examples:
    - "For patients with type 2 diabetes, what are the typical differences in glycemic management,
       renal monitoring, and medication choice between elderly patients, those with CKD, and those with CHF?"
    - "What clinical patterns are documented in COPD exacerbation care regarding oxygen therapy,
       steroid dosing, and management when concurrent heart failure or elderly age are present?"

    Requirements:
    - Asks about observable patterns in the data, not what "should" be done
    - Can be answered by reading across many discharge notes (not from a textbook)
    - Requires evidence from multiple patients - no single note fully answers it
    - Touches multiple aspects from the list above

    Keep the question to 1-2 sentences. Return ONLY the question, nothing else.

gen_queries_llm:
  save_every: 25
  model: gemma4:31b
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  think: false

filter_queries:
  k_values: [ 5, 10, 20, 30 ]
  lam_values: [ 0.3, 0.5, 0.7, 0.8 ]
  jaccard_threshold: 0.85

gold_annotation:
  batch_size: 20
  wide_pool_n: 10000
  final_pool_n: 3000
  min_per_modifier: 50
  num_ctx: 8_000
  num_predict: 2000
  model: gemma4:31b
  temperature: 0.35
  top_p: 0.95
  top_k: 40
  think: false
  stream: false
  tagging_system_prompt: >-
    You are a clinical information analyst. You will be given a clinical
    question, one specific aspect of that question, and a batch of discharge
    note excerpts. Decide whether each chunk contains substantive evidence for
    the specified aspect only.
  tagging_user_template: |
    QUESTION: {query_text}
    ASPECT: {facet_label} - {facet_description}

    For each chunk below, decide whether it contains SUBSTANTIVE evidence for THIS aspect only.
    Substantive = specific drugs with doses, specific labs with clinical interpretation,
    specific procedures with rationale, or explicit reasoning linking this aspect to the question.
    Mere mentions of a condition or drug without context are NOT substantive.

    <CHUNKS>
    {chunks_block}
    </CHUNKS>

    Return JSON: {{"decisions": [{{"chunk_id": "<id>", "relevant": true, "why": "<up to 15 words>"}}, ...]}}
    Include exactly one decision per chunk shown above. If none are relevant, return relevant=false for all.
    Return ONLY the JSON, nothing else.
