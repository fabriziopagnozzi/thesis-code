build_query_prompts:
  n_grounding_patients: 6
  max_modifiers: 3

  high_value_sections:
    - BRIEF HOSPITAL COURSE
    - HISTORY OF PRESENT ILLNESS
    - PERTINENT RESULTS
    - DISCHARGE DIAGNOSIS
    - DISCHARGE MEDICATIONS

  charlson_labels:
    myocardial_infarct: prior myocardial infarction
    congestive_heart_failure: congestive heart failure
    peripheral_vascular_disease: peripheral vascular disease
    cerebrovascular_disease: cerebrovascular disease
    dementia: dementia
    chronic_pulmonary_disease: chronic pulmonary disease (COPD)
    rheumatic_disease: rheumatic disease
    peptic_ulcer_disease: peptic ulcer disease
    mild_liver_disease: mild liver disease
    diabetes_without_cc: diabetes without complications
    diabetes_with_cc: diabetes with chronic complications
    paraplegia: hemiplegia or paraplegia
    renal_disease: chronic kidney disease
    malignant_cancer: malignancy
    severe_liver_disease: severe liver disease (cirrhosis)
    metastatic_solid_tumor: metastatic cancer
    aids: HIV/AIDS

  demographic_modifiers:
    - text: "the patient is elderly (age > 75)"
      column: age
      op: ">"
      value: 75
    - text: "the patient is a young adult (age < 40)"
      column: age
      op: "<"
      value: 40

  prompt_template: |
    Below are excerpts from real discharge summaries of patients admitted for {condition} where {modifier} was also present.

    <START DISCHARGE SUMMARIES EXAMPLES>
    {chunks_block}
    <END DISCHARGE SUMMARIES EXAMPLES>

    Using these real cases as background, generate ONE question about {condition} that:
    - Asks what medications, labs, procedures, or complications are observed when {modifier} is present
    - Can be answered by reading across many patient discharge notes (not from a textbook)
    - Is concrete and specific (e.g. "What medications are prescribed at discharge for..." or "What complications are seen in..." or "What labs are monitored for...")
    - Requires evidence from multiple patients — no single note fully answers it

    Keep the question short (1-2 sentences). Do NOT write an abstract clinical reasoning question.
    The question should ask about observable patterns in the data, not about what "should" be done.

    Return ONLY the question, nothing else.

gen_queries_llm:
  save_every: 25
  model: gemma4:26b
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  think: false

filter_queries:
  k: 10
  lam: 0.35
  jaccard_threshold: 0.8
  prefilter_n: 900

gold_annotation:
  prefilter_n: 900
  batch_size: 30
  num_ctx: 32768
  num_predict: 16384
  model: gemma4:26b
  temperature: 0.3
  top_p: 0.95
  top_k: 64
  think: false
  map_system_prompt: >-
    You are a clinical information analyst extracting structured evidence from discharge notes.
    Your task: for a given clinical question, identify which chunks contain SUBSTANTIVE information
    and group them under a small set of high-level INFORMATION TYPE facets.
    A facet is a TYPE OF INFORMATION — not a specific drug, lab value, or patient scenario.
    Use the fewest facets that completely cover the answer.

    IMPORTANT: Only tag a chunk if it provides substantive, specific information that
    directly helps answer the question — not just a passing mention of a related term.
    A chunk that says "continued home medications" is NOT substantive.
    A chunk that says "started metoprolol 25mg for rate control given new-onset AFib" IS substantive.
    When in doubt, do NOT tag the chunk.
  map_user_template: |
    Question: {query_text}

    Below are excerpts from clinical discharge notes. Each is prefixed with its chunk ID, section, and patient context.

    <START DISCHARGE NOTES BLOCK>
    {chunks_block}
    <END DISCHARGE NOTES BLOCK>

    Identify the information aspects (facets) needed to fully answer the question. For each facet:
    1. Assign a short snake_case label describing the INFORMATION TYPE, not a specific drug or value.
       Good labels: "medication", "lab_result", "procedure", "complication", "clinical_reasoning", "disposition"
       Bad labels: "insulin_dose_reduction_for_ckd", "metformin_contraindication", "creatinine_monitoring"
    2. State one representative fact for this facet (one sentence)
    3. List ALL chunk_ids in this batch that provide evidence for this facet

    Rules:
    - Use at most 6 facet labels across your entire response
    - Merge facts that address the same decision category under one label
    - Only cite chunk_ids that appear in this batch
    - Check the patient metadata line (age, gender, comorbidities) on each chunk.
      Only tag a chunk if the patient profile matches what the question asks about.
    - Only tag chunks that provide SUBSTANTIVE detail: specific drugs with doses, specific lab values
      with clinical interpretation, specific procedures with rationale, or explicit clinical reasoning.
      Do NOT tag chunks that merely mention a condition, list a medication name without context,
      or contain boilerplate text.

    Return a JSON array. Example:
    [{{"facet_label": "dose_adjustment", "fact": "Insulin dose reduced by 20-30% when CrCl < 30 to avoid hypoglycemia", "chunk_ids": ["chunk_42", "chunk_87"]}}]

    If no chunks in this batch are relevant, return an empty array: []. Stick strictly to these instructions.
